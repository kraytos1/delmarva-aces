<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Rafters · Delmarva Aces</title>
<!-- Carries championship team photos of the kids, so it follows the same rule
     as photos.html: findable by families who have the link, not by search. -->
<meta name="robots" content="noindex, nofollow"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<meta name="theme-color" content="#E8530A"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="/nav.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
:root{
  color-scheme:dark;
  --orange:#E8530A;--orange2:#C44208;
  --gold:#d4a042;--gold-lt:#e8c06a;
  --black:#0A0C0E;--dark:#111418;--dark2:#181C22;--dark3:#1F242C;
  --bdr:rgba(255,255,255,.08);--bdr-a:rgba(232,83,10,.35);
  --text:#F0EDE8;--muted:#7A8290;--green:#3DDC6A;
  --mono:'Roboto Mono',monospace;--display:'Oswald',sans-serif;--body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--text);font-family:var(--body);overflow-x:hidden;}

/* the room: a dark gym, one light source above the rafter */
.hall{position:relative;padding:0 0 60px;
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(232,83,10,.10), transparent 60%),
    radial-gradient(90% 50% at 50% 0%, rgba(255,255,255,.045), transparent 70%),
    var(--black);}

.head{max-width:1180px;margin:0 auto;padding:34px 20px 8px;text-align:center;}
.head .kick{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--orange);text-transform:uppercase;}
.head h1{font-family:var(--display);font-size:clamp(2.1rem,7vw,3.4rem);font-weight:700;
  letter-spacing:1px;line-height:1;margin-top:8px;text-transform:uppercase;}
.tally{display:flex;gap:26px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
.tally div{text-align:center;}
.tally .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--gold-lt);line-height:1;}
.tally .n.o{color:var(--orange);}
.tally .l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;
  text-transform:uppercase;margin-top:5px;}

/* ── the rafter ──
   One CONTINUOUS beam with the banners hanging off it. The rack scrolls
   sideways rather than wrapping: a wrapped banner would hang from nothing,
   and the wall has to keep working as more banners get added. */
.rafter-wrap{position:relative;max-width:1180px;margin:40px auto 0;padding:0 20px;}
.rack{overflow-x:auto;overflow-y:hidden;padding-bottom:12px;
  scrollbar-width:thin;scrollbar-color:#2a303a transparent;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);}
.rack::-webkit-scrollbar{height:6px;}
.rack::-webkit-scrollbar-thumb{background:#2a303a;border-radius:3px;}
.rack-in{display:inline-block;min-width:100%;padding:0 22px;}
.beam{position:relative;height:16px;border-radius:3px;
  background:linear-gradient(180deg,#2b3038 0%,#1a1e24 42%,#0e1116 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.10);}
.beam::before{content:'';position:absolute;inset:0;height:1px;top:-9px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);}

/* ── banners ── */
.wall{display:flex;gap:clamp(11px,1.9vw,23px);justify-content:center;align-items:flex-start;
  flex-wrap:nowrap;padding:0 4px;}
.banner{
  --w:clamp(130px,12vw,152px);
  width:var(--w);flex:0 0 auto;position:relative;cursor:pointer;
  border:none;padding:0;background:none;text-align:center;color:inherit;
  transform-origin:top center;
  animation:drop .85s cubic-bezier(.16,1,.3,1) both;
}
@keyframes drop{
  0%{opacity:0;transform:translateY(-38px) rotate(-2.5deg);}
  60%{opacity:1;transform:translateY(0) rotate(.9deg);}
  100%{opacity:1;transform:translateY(0) rotate(0);}
}
/* the hanger: two grommets + the strap over the beam */
.straps{position:relative;height:22px;display:flex;justify-content:center;gap:calc(var(--w) * .42);}
.straps i{display:block;width:9px;height:22px;border-radius:0 0 2px 2px;
  background:linear-gradient(180deg,#3a4048,#232830);box-shadow:0 1px 2px rgba(0,0,0,.6);}
.straps i::after{content:'';display:block;width:5px;height:5px;border-radius:50%;
  background:#0c0f13;margin:13px auto 0;box-shadow:inset 0 1px 1px rgba(0,0,0,.9);}

.cloth{position:relative;padding:16px 12px 34px;
  /* banners on a rafter hang to the SAME length — uniform height, content
     distributed, logo pinned to the tail */
  min-height:236px;display:flex;flex-direction:column;
  clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);
  background:linear-gradient(175deg,#20262f 0%,#151a21 55%,#0f1319 100%);
  box-shadow:0 16px 34px rgba(0,0,0,.55);
  transition:transform .32s cubic-bezier(.16,1,.3,1), filter .32s;}
.banner:hover .cloth,.banner:focus-visible .cloth{transform:translateY(3px) scale(1.028);filter:brightness(1.1);}
.banner:focus-visible{outline:none;}
.banner:focus-visible .cloth{box-shadow:0 16px 34px rgba(0,0,0,.55),0 0 0 2px var(--orange);}
/* stitched inner edge + woven texture */
.cloth::before{content:'';position:absolute;inset:6px 6px 12px;border:1px dashed rgba(255,255,255,.13);
  clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);pointer-events:none;}
.cloth::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);}

.b-yr{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--muted);}
.b-name{font-family:var(--display);font-size:12px;font-weight:600;line-height:1.24;
  text-transform:uppercase;letter-spacing:.3px;margin-top:10px;padding:0 1px;
  text-wrap:balance;}
.b-rec{font-family:var(--display);font-size:clamp(27px,3.5vw,35px);font-weight:700;line-height:1;
  margin-top:auto;padding-top:12px;color:var(--text);}
/* a word where a score would go ("CHAMPS") needs its own scale — a 6-letter
   word at score size overruns the cloth */
.b-rec.word{font-size:clamp(17px,2vw,21px);letter-spacing:2.5px;}
.b-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);margin-top:7px;}
.b-logo{width:24px;margin:12px auto 0;display:block;opacity:.5;}
/* a banner carrying the coach's write-up gets a quiet mark */
.b-story{font-family:var(--mono);font-size:7.5px;letter-spacing:1.6px;color:var(--gold);
  opacity:.75;margin-top:8px;}
/* drawn stars — a banner's rank marks, not a text glyph */
.stars{display:flex;gap:3px;justify-content:center;margin-top:8px;}
.stars svg{width:9px;height:9px;display:block;}
.stars svg path{fill:var(--gold);}
.banner.major .stars svg{width:11px;height:11px;}

/* tiers — gold is the championship voice, orange stays the live/now signal */
.banner.title .cloth{background:linear-gradient(175deg,#2a2114 0%,#1a1610 55%,#100e0b 100%);}
.banner.title .b-rec,.banner.title .b-name{color:var(--gold-lt);}
.banner.title .b-tag{color:var(--gold);}
/* the marquee banner hangs LONGER and wider — the way the big one always does */
.banner.major{--w:clamp(158px,15.4vw,194px);}
.banner.major .cloth{min-height:296px;
  background:linear-gradient(175deg,#3a2c16 0%,#241c10 52%,#12100c 100%);
  box-shadow:0 20px 44px rgba(0,0,0,.62),0 0 34px rgba(212,160,66,.13);}
.banner.major .b-name{font-size:14.5px;}
.banner.major .b-rec{color:var(--gold-lt);font-size:clamp(34px,4.6vw,46px);}
.banner.major .b-rec.word{font-size:clamp(20px,2.5vw,26px);letter-spacing:3px;}
.banner.major .b-tag{color:var(--gold);font-size:9px;}
.banner.major .b-logo{width:32px;opacity:.75;}
.banner.season .b-rec{color:var(--orange);}
.banner.pending{opacity:.62;}
.banner.pending .cloth{background:linear-gradient(175deg,#191d24 0%,#141821 60%,#0e1116 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.45);}
.banner.pending .b-rec{color:var(--muted);font-weight:500;}

/* ── detail drawer ── */
.drawer{max-width:1180px;margin:34px auto 0;padding:0 20px;}
.drawer-in{background:var(--dark2);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;
  display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);}
.drawer-in.show{display:block;animation:fade .3s ease-out both;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d-top{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;gap:14px;
  align-items:baseline;flex-wrap:wrap;background:
   radial-gradient(120% 130% at 0% 0%,rgba(212,160,66,.1),transparent 55%),var(--dark);}
.d-yr{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold);}
.d-name{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;}
.d-rec{font-family:var(--display);font-size:20px;font-weight:700;color:var(--gold-lt);margin-left:auto;}
.d-close{background:none;border:1px solid var(--bdr);color:var(--muted);border-radius:6px;
  font-family:var(--mono);font-size:10px;padding:5px 10px;cursor:pointer;letter-spacing:1px;}
.d-close:hover{color:var(--text);background:var(--dark3);}
.d-body{padding:12px 20px 18px;}
.d-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.6px;line-height:1.9;}
/* The championship photo — the team's tradition, and the thing families
   actually want to see. Leads the drawer: photo, then story, then proof. */
.d-photo{position:relative;margin:2px 0 16px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(212,160,66,.22);background:var(--dark);
  box-shadow:0 12px 30px rgba(0,0,0,.5);}
.d-photo img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;
  object-position:center 30%;}
.d-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 16px 9px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
  color:#F0EDE8;background:linear-gradient(180deg,transparent,rgba(6,8,10,.88));}
.d-photo figcaption b{color:var(--gold-lt);font-weight:600;}

/* Coach's recap — the part a box score can't hold. His words, unedited. */
.recap{background:rgba(212,160,66,.05);border:1px solid rgba(212,160,66,.16);
  border-radius:10px;padding:14px 18px 4px;margin:2px 0 16px;}
.recap-by{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px;}
.recap p{font-size:13.5px;line-height:1.8;color:var(--text);max-width:74ch;margin-bottom:11px;}
.recap p:last-child{margin-bottom:11px;}
.recap-src{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;
  border-top:1px solid rgba(255,255,255,.06);padding-top:8px;margin-top:2px;}
.g-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045);}
.g-row:last-child{border-bottom:none;}
.g-date{font-family:var(--mono);font-size:10px;color:var(--muted);width:52px;flex-shrink:0;}
.g-opp{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-sc{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.5px;}
.g-sc.w{color:var(--green);} .g-sc.l{color:#e07a5f;}

@media (max-width:640px){
  .rafter-wrap{padding:0 8px;}
  .rack-in{padding:0 14px;}
  .wall{gap:11px;justify-content:flex-start;}
  .banner{--w:126px;}
  .banner.major{--w:154px;}
}
@media (prefers-reduced-motion:reduce){
  .banner{animation:none;}
  .cloth,.drawer-in{transition:none;animation:none;}
}
</style>
</head>
<body>

<div id="site-nav"></div>

<div class="hall">
  <div class="head">
    <div class="kick">Delmarva Aces · 12U East</div>
    <h1>The Rafters</h1>
    <div class="tally">
      <div><div class="n" id="t-titles">—</div><div class="l">Championships</div></div>
      <div><div class="n o" id="t-rec">—</div><div class="l">Spring 2026</div></div>
      <div><div class="n" id="t-sweeps">—</div><div class="l">In Those Ten</div></div>
    </div>
  </div>

  <div class="rafter-wrap">
    <div class="rack">
      <div class="rack-in">
        <div class="beam"></div>
        <div class="wall" id="wall"></div>
      </div>
    </div>
  </div>

  <div class="drawer">
    <div class="drawer-in" id="drawer">
      <div class="d-top">
        <span class="d-yr" id="d-yr"></span>
        <span class="d-name" id="d-name"></span>
        <span class="d-rec" id="d-rec"></span>
        <button class="d-close" id="d-close">CLOSE</button>
      </div>
      <div class="d-body" id="d-body"></div>
    </div>
  </div>

</div>

<script>
// ── BANNER DATA ────────────────────────────────────────────────────────────
// RULE (Chris, 2026-08-13): CHAMPIONSHIPS ONLY. A rafter full of participation
// banners dilutes the real ones — only titles hang, plus the empty hook for the
// one still being written. The season record lives in the tally, not on a
// banner (Cooperstown and the overall record are kept separate on purpose).
//
// Games are matched by DATE RANGE, not by games.tournament — our own tournament
// labels are unreliable (six of these spring events were all filed under a
// single "Spring 2026" bucket, and two carried the wrong event name entirely).
// The dates come from Chris's list; every record below was computed from the
// real game rows in that window.
// tier: 'major' | 'title' | 'pending'
const BANNERS = [
  { d:'FEB 14–16', name:"President's Day 42 Challenge", loc:'Vero Beach, FL',
    rec:'6–0', tier:'title', stars:3, from:'2026-02-14', to:'2026-02-16' },

  { d:'MAR 14–15', name:'Ripken Opening Day', loc:'Aberdeen, MD',
    rec:'5–0', tier:'title', stars:3, from:'2026-03-14', to:'2026-03-15' },

  { d:'MAR 28–29', name:'USSSA Shake the Rust Rumble', loc:'Kent Island, MD',
    rec:'5–0', tier:'title', stars:3, from:'2026-03-28', to:'2026-03-29' },

  { d:'APR 11–12', name:'Mutiny in the Park', loc:'Olney, MD',
    rec:'5–0', tier:'title', stars:3, from:'2026-04-11', to:'2026-04-12' },

  { d:'APR 17–19', name:'OBX Bash at the Beach', loc:'Kitty Hawk, NC',
    rec:'5–0', tier:'title', stars:3, from:'2026-04-17', to:'2026-04-19' },

  { d:'MAY 2–3', name:"Who's Who", loc:'Ocean City, MD',
    rec:'5–0', tier:'title', stars:3, from:'2026-05-02', to:'2026-05-03',
    recapBy:'May 4', recap:[
      "12U East is the champion of Who's Who Mid-Atlantic Regional in Ocean City, MD. The team went 5-0 in the event that was comprised of 14 of the top 12U teams in the entire Mid-Atlantic.",
      "With the win, Aces East moves to 34-1 in 2026 and 46-2 as 12Us. The championship was their sixth of the spring.",
      "The team took the No. 1 seed after a 2-0 start the tourney. Raiden Sheets threw three scoreless innings to lead team in the opener, before Jackson Booher struck out nine in four innings and Ayden Jester homered twice in the nightcap win.",
      "Jester and Hudson Hartstein were nearly perfect on the mound in the quarters and semis. Hartstein doubled to left-center and capped a nine run come-from-behind win as 12E won 9-8 in the semis.",
      "Jake Coulbourne homered twice and scattered two hits in the complete-game victory on the mound in the championship. MVP of the tournament went to Ayden Jester, who homered five times and played awesome from top to bottom.",
    ] },

  { d:'MAY 15–17', name:'Shipyard #82', loc:'Mt Pleasant, SC',
    rec:'4–0', tier:'title', stars:3, from:'2026-05-15', to:'2026-05-17',
    recapBy:'May 18', recap:[
      "12U East is the champion of Shipyard Park in Mount Pleasant, South Carolina. The team went 4-0 at the event and upped their record to 42-2 on the season following the championship in South Carolina.",
      "The team opened up with a 21-0 win as they pounded out 15 hits on Friday night. Ayden Jester was 3-for-3 with three home runs and five RBIs, while a trio of pitchers combined on the complete game shutout.",
      "The team went 2-0 on Saturday and Jake Coulbourne, Hunter Washbon and Mason Maloney combined to throw a perfect game in the first contest. Squad won 9-0 in game two behind a grand slam by Hudson Hartstein to take the win and secure the number one seed.",
      "The team capped off the tournament with a thrilling come-from-behind victory to walk it off in the championship game. It was Jester again that hit the decisive game-winning home run as he plated Hartstein, who singled earlier in the inning.",
    ] },

  { d:'MAY 23–25', name:'ESTB Memorial Day Classic', loc:'Fruitland, MD',
    rec:'5–0', tier:'title', stars:3, from:'2026-05-23', to:'2026-05-25',
    recapBy:'May 26', recap:[
      "12U East is the champion of ESTB Memorial Day Classic. The squad went 5-0 at the event after running the table in the local tourney. With their success at the event, 12E ups its record to 47-2 in the spring and 59-3 as 12Us.",
      "The team opened up play with three convincing wins in pool play on Saturday and Sunday. The team used a four-RBI performance by Jackson Booher and two hitless innings on the bump by Cooper Lewis to lead the way in the opening win on Saturday.",
      "Ayden Jester and Hudson Hartstein each had three RBIs in Sunday's first game. W. Hunter Washbon and Wyatt Wiltbank combined on a no-hitter to close Sunday, before Washbon hit two homeruns to lead the way in Monday's semifinal win.",
      "In the championship, the squad won a close 6-5 contest after Jester struck out eight hitters in four innings and Jake Coulbourne shut it down with the save. The decisive blow came on an RBI double by Booher to score Maloney, before Hartstein produced an RBI single to seal it.",
    ] },

  { d:'JUN 12–14', name:'Perfect Game Bear Down', loc:'Bear, DE',
    rec:'5–0', tier:'title', stars:3, from:'2026-06-12', to:'2026-06-14',
    recapBy:'June 16', recap:[
      "12U East is the champion of Perfect Game Beardown in Bear, DE. The squad went 5-0 at the event to take home their ninth championship of the spring season. With the title in Delaware, they have now won tournaments in five different states in 2026 (Florida, South Carolina, North Carolina, Maryland & Delaware).",
      "Their finish at the PG event moves their record to 52-2 this season and 64-3 as 12Us dating back to the fall. The team set a new program record as the 52 wins are now the most wins in a single-season by any Delmarva Aces team dating back to 2014.",
      "MVP of the tournament goes to 2032 Hudson Hartstein, while 2031 Jake Coulbourne was recognized as the MVP Pitcher.",
      "Onto Cooperstown next!",
    ] },

  // The crown. Kept separate from the season record, per Chris.
  // Cooperstown week is the one block of spring that never made it into the
  // `games` table — these ten rows come from index.html's spring archive
  // (which is where the site's 62-2 comes from). The drawer prefers the DB and
  // falls back to these, so it starts working on its own if they ever load.
  { d:'JUN 24–30', name:'Cooperstown', loc:'Cooperstown, NY',
    rec:'10–0', tier:'major', stars:5, from:'2026-06-24', to:'2026-06-30',
    games:[
      ['2026-06-26','Park Sharon Nationals',11,4],
      ['2026-06-26','G3 12U - Gonzalez',19,5],
      ['2026-06-26','ZBC 12u Green',15,0],
      ['2026-06-27','Ohio Valley Xpress 12U',16,3],
      ['2026-06-27','Knoxville Stars 12U',15,3],
      ['2026-06-28','Battle Utah 12U',14,1],
      ['2026-06-29','West Pines Cobras Venom 2032 12U',16,4],
      ['2026-06-29','Tidewater Drillers 12U',13,5],
      ['2026-06-29','Devine Baseball Navy 12U',18,7],
      ['2026-06-29','Wesley Chapel Storm 12U',18,5],
    ] },

  { d:'FALL 2026', name:'13U East', loc:'The story starts now', rec:'—',
    tier:'pending', from:null, to:null, note:'This one is still being written.' },
];

// Spring 2026 season line — shown in the tally, deliberately NOT a banner.
const SEASON = { rec:'62–2', label:'Spring 2026', all:'74–3' };

const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6l3.1 6.9 7.5.8-5.6 5 1.6 7.4-6.6-3.8-6.6 3.8 1.6-7.4-5.6-5 7.5-.8z"/></svg>';

const db = supabase.createClient(ACES_CONFIG.supabaseUrl, ACES_CONFIG.supabaseKey);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  const wall = $('wall');
  wall.innerHTML = BANNERS.map((b,i) => `
    <button class="banner ${b.tier}" style="animation-delay:${i*70}ms" data-i="${i}"
            aria-label="${esc(b.name)}, ${esc(b.loc)}, ${esc(b.rec)}">
      <div class="straps"><i></i><i></i></div>
      <div class="cloth">
        <div class="b-yr">${esc(b.d)}</div>
        <div class="b-name">${esc(b.name)}</div>
        <div class="b-rec${/[A-Za-z]/.test(b.rec) ? ' word' : ''}">${esc(b.rec)}</div>
        ${b.stars ? `<div class="stars">${STAR.repeat(b.stars)}</div>` : ''}
        <div class="b-tag">${esc(b.loc)}</div>
        ${b.recap ? '<div class="b-story">READ THE STORY</div>' : ''}
        <img class="b-logo" src="/icon-192.png" alt=""/>
      </div>
    </button>`).join('');

  // Every hanging banner IS a championship (the wall's rule), minus the
  // not-yet-written one. The combined title-run record is the headline: every
  // game played inside a tournament they won.
  const won = BANNERS.filter(b => b.tier !== 'pending');
  const runW = won.reduce((s,b) => s + (parseInt(b.rec,10) || 0), 0);
  const runL = won.reduce((s,b) => s + (parseInt((b.rec.split('–')[1]||'0'),10) || 0), 0);
  $('t-titles').textContent = won.length;
  $('t-rec').textContent = SEASON.rec;
  $('t-sweeps').textContent = `${runW}–${runL}`;

  wall.querySelectorAll('.banner').forEach(el =>
    el.addEventListener('click', () => open(BANNERS[+el.dataset.i])));
}

async function open(b){
  const d = $('drawer');
  $('d-yr').textContent = b.d + ' · ' + b.loc;
  $('d-name').textContent = b.name;
  $('d-rec').textContent = b.rec;
  $('d-body').innerHTML = `<div class="d-note">Loading games…</div>`;
  d.classList.add('show');
  d.scrollIntoView({behavior:'smooth', block:'nearest'});

  if (!b.from){
    $('d-body').innerHTML = photoHtml(b) + recapHtml(b) + `<div class="d-note">${esc(b.note || 'No game-by-game detail stored for this one yet.')}</div>`;
    loadPhoto(b);
    return;
  }
  // local rows -> the same shape the DB returns, so one renderer handles both
  const local = (b.games || []).map(g => ({
    game_date:g[0], opponents:{name:g[1]}, our_score:g[2], opp_score:g[3] }));
  try{
    const { data, error } = await db.from('games')
      .select('game_date,our_score,opp_score,status,opponents(name)')
      .gte('game_date', b.from).lte('game_date', b.to)
      .eq('status','final').order('game_date');
    if (error) throw error;
    const rows = (data && data.length) ? data : local;
    if (!rows.length){
      $('d-body').innerHTML = photoHtml(b) + recapHtml(b) + `<div class="d-note">${esc(b.note || 'No game rows stored for this tournament yet.')}</div>`;
      loadPhoto(b);
      return;
    }
    renderGames(rows, null, b);
  }catch(e){
    console.error(e);
    if (local.length) renderGames(local, "Couldn't reach the database — showing the archived list.", b);
    else $('d-body').innerHTML = `<div class="d-note">Couldn't load games for this tournament.</div>`;
  }
}

// The championship photo leads the drawer. Photos are found BY CONVENTION so
// adding one never needs a code change: drop the coach's CHAMPIONS shot at
//   /championships/<slug>.jpg      (png / jpeg / webp also work)
// and it appears. `photo:` on a banner overrides the convention with any URL.
// Nothing is rendered until an image actually loads, so a missing photo leaves
// no empty frame — see championships/README.md for the exact filenames.
// Two extensions only, and misses are remembered: probing six variants logged
// six console 404s per photoless banner, which buries real errors.
const PHOTO_EXT = ['jpg','png'];
const photoMiss = new Set();
function slug(s){
  return String(s||'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function photoHtml(b){
  if (!b || b.tier === 'pending') return '';
  return `<figure class="d-photo" id="d-photo" hidden>
    <img alt="Delmarva Aces after winning ${esc(b.name)}"/>
    <figcaption><b>Champions</b> · ${esc(b.name)} · ${esc(b.loc)}</figcaption>
  </figure>`;
}
// Try the explicit URL, then each extension in turn; reveal on the first hit.
function loadPhoto(b){
  const fig = document.getElementById('d-photo');
  if (!fig || !b || b.tier === 'pending') return;
  const key = b.photo || slug(b.name);
  if (photoMiss.has(key)) { fig.remove(); return; }   // already known absent
  const img = fig.querySelector('img');
  const tries = b.photo ? [b.photo]
                        : PHOTO_EXT.map(e => `/championships/${slug(b.name)}.${e}`);
  let i = 0;
  img.onload  = () => { fig.hidden = false; };
  img.onerror = () => {
    if (++i < tries.length) { img.src = tries[i]; return; }
    photoMiss.add(key); fig.remove();
  };
  img.src = tries[0];
}

// The coach writes a recap after every championship. A box score can't hold a
// walk-off; his words can. Shown above the games, in his voice, unedited.
function recapHtml(b){
  if (!b || !b.recap || !b.recap.length) return '';
  return `<div class="recap">
    <div class="recap-by">Coach's recap${b.recapBy ? ' · ' + esc(b.recapBy) : ''}</div>
    ${b.recap.map(p => `<p>${esc(p)}</p>`).join('')}
  </div>`;
}

function renderGames(rows, prefix, b){
  const w = rows.filter(g => g.our_score > g.opp_score).length;
  const l = rows.filter(g => g.our_score < g.opp_score).length;
  const rf = rows.reduce((s,g) => s + (g.our_score||0), 0);
  const ra = rows.reduce((s,g) => s + (g.opp_score||0), 0);
  $('d-body').innerHTML =
    photoHtml(b) + recapHtml(b) +
    (prefix ? `<div class="d-note" style="margin-bottom:6px;">${esc(prefix)}</div>` : '') +
    `<div class="d-note" style="margin-bottom:8px;">${rows.length} GAMES · ${w}-${l} · ${rf} RUNS SCORED, ${ra} ALLOWED</div>` +
    rows.map(g => {
      const win = g.our_score > g.opp_score;
      const dt = (g.game_date||'').slice(5).replace('-','/');
      return `<div class="g-row">
        <span class="g-date">${esc(dt)}</span>
        <span class="g-opp">${esc((g.opponents && g.opponents.name) || 'Opponent')}</span>
        <span class="g-sc ${win?'w':'l'}">${win?'W':'L'} ${g.our_score}–${g.opp_score}</span>
      </div>`;
    }).join('');
  loadPhoto(b);
}

$('d-close').addEventListener('click', () => $('drawer').classList.remove('show'));
render();

// Land with the marquee (Cooperstown — the biggest win of the year) centered in
// the rack. Scrolls the RACK only, never the page: scrollIntoView would drag
// the window down past the header. Runs after layout so the measurement is real.
function centerMarquee(){
  const rack = document.querySelector('.rack');
  const inner = rack && rack.querySelector('.rack-in');
  const m = rack && rack.querySelector('.banner.major');
  if (!rack || !m || !inner) return;

  // Nothing scrolls => the whole wall is already on screen; centering is moot
  // and tail padding would only invent dead space.
  inner.style.paddingRight = '';
  if (rack.scrollWidth <= rack.clientWidth + 1) return;

  const want = () => {
    const r = rack.getBoundingClientRect(), b = m.getBoundingClientRect();
    return rack.scrollLeft + (b.left + b.width/2) - (r.left + r.width/2);
  };
  // Cooperstown sits second-from-last, so there isn't enough wall after it to
  // scroll it to the middle. Add exactly the shortfall as tail padding.
  const short = want() - (rack.scrollWidth - rack.clientWidth);
  if (short > 0) inner.style.paddingRight = (22 + Math.ceil(short)) + 'px';

  rack.scrollLeft = Math.max(0, Math.min(want(), rack.scrollWidth - rack.clientWidth));
}
// Center on every settle point: layout, webfonts (Oswald changes banner
// widths), images, and once more late — Chrome restores a scroll container's
// position on reload AFTER load fires, which silently undid the centering.
requestAnimationFrame(() => requestAnimationFrame(centerMarquee));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(centerMarquee);
window.addEventListener('load', centerMarquee);
setTimeout(centerMarquee, 350);
let _rz; window.addEventListener('resize', () => {
  clearTimeout(_rz); _rz = setTimeout(centerMarquee, 180);
});
</script>
</body>
</html>
