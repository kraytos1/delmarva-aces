<title>Aces Combine</title>
<!--
THESIS: A broadcast control-room stat wall for a youth training facility — the room's own
scoreboard, not a dashboard. Refuses the widget-grid dashboard default.
OWN-WORLD: Aces scorebug material — near-black panels (#12161C→#0C0F14), hairline rules,
Aces orange (#E8530A) carrying whole fields, cream text, Oswald condensed display numerals,
Roboto Mono data ticker. Recognizable with content removed as a TV sports graphic.
STORY: A kid walks past a TV, sees their name ranked among their own age group, a NEW PR
takeover when they beat themselves, and grinds for screen time.
FIRST VIEWPORT: Full-bleed leaderboard — station name and age chip top-left, the leader's
value at 220px in orange left field, ranks 2&#8211;8 as ruled rows right. Ticker of latest results
runs the lower third. No primary action: the surface is read from 20 feet.
FORM: Established Aces world extended to a new surface (brief-pinned); no concept roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
the verdict, and DESIGN.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  /* Single-theme by design: this page lives on facility TVs in a dim building.
     Every color painted explicitly so it holds on any host ground. */
  :root{
    --ink:#07090C; --panel-a:#12161C; --panel-b:#0C0F14;
    --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
    --orange:#E8530A; --orange-hot:#FF7A33; --orange-deep:#B23C05;
    --cream:#F2EEE6; --muted:#8A94A3; --navy:#233566; --navy-hi:#3A5399;
    --display:'Oswald',ui-sans-serif,system-ui,sans-serif;
    --body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --mono:'Roboto Mono',ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#000; overflow:hidden; font-family:var(--body); color:var(--cream);
    -webkit-font-smoothing:antialiased; }

  /* ── 1920×1080 broadcast stage, letterboxed onto any screen ── */
  #stage{ position:absolute; top:50%; left:50%; width:1920px; height:1080px;
    transform-origin:center; background:var(--ink); display:flex; flex-direction:column;
    overflow:hidden; }
  /* faint field-lighting atmosphere — one gradient, no texture noise */
  #stage::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(1100px 520px at 24% -8%, rgba(232,83,10,.10), transparent 62%),
      radial-gradient(900px 600px at 108% 112%, rgba(35,53,102,.22), transparent 60%);
  }

  /* ── Top bar ── */
  #topbar{ position:relative; z-index:3; height:96px; flex:none; display:flex; align-items:center;
    gap:24px; padding:0 44px; background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border-bottom:1px solid var(--line); }
  #topbar .logo{ height:64px; width:64px; object-fit:contain; }
  #topbar .word{ display:flex; flex-direction:column; justify-content:center; }
  #topbar .word .t1{ font-family:var(--display); font-weight:700; font-size:34px; line-height:1;
    letter-spacing:.06em; text-transform:uppercase; }
  #topbar .word .t1 em{ font-style:normal; color:var(--orange-hot); }
  #topbar .word .t2{ font-size:14px; font-weight:700; letter-spacing:.3em; text-transform:uppercase;
    color:var(--muted); margin-top:6px; }
  #zonechip{ margin-left:12px; display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:999px; padding:10px 22px 10px 16px;
    font-size:17px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; }
  #zonechip .dot{ width:10px; height:10px; border-radius:50%; background:var(--orange-hot);
    box-shadow:0 0 12px rgba(255,122,51,.8); }
  #topbar .right{ margin-left:auto; display:flex; align-items:center; gap:22px; }
  .sample{ font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:.16em;
    color:#FFB58A; border:1px solid rgba(232,83,10,.5); border-radius:6px; padding:7px 12px;
    background:rgba(232,83,10,.12); }
  #clock{ font-family:var(--display); font-weight:600; font-size:34px; letter-spacing:.05em;
    font-variant-numeric:tabular-nums; }
  #clock small{ font-size:16px; color:var(--muted); font-weight:500; margin-left:6px; letter-spacing:.12em; }

  /* board timer */
  #progress{ position:relative; z-index:3; height:4px; flex:none; background:var(--line-soft); }
  #progress i{ display:block; height:100%; width:0%;
    background:linear-gradient(90deg,var(--orange-deep),var(--orange-hot)); }

  /* ── Board area ── */
  #boards{ position:relative; flex:1; z-index:2; }
  .board{ position:absolute; inset:0; padding:52px 72px 44px; display:flex; }
  .board.leaving{ z-index:1; }
  .board.entering{ z-index:2; clip-path:polygon(-18% 0,-2% 0,-34% 100%,-50% 100%); }
  .board.entering.in{ clip-path:polygon(-18% 0,120% 0,120% 100%,-50% 100%);
    transition:clip-path .72s cubic-bezier(.16,1,.3,1); }
  /* orange slash sweeping ahead of the wipe */
  #slash{ position:absolute; top:-6%; bottom:-6%; width:150px; z-index:4; pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--orange) 42%,var(--orange-hot) 58%,transparent);
    transform:translateX(-360px) skewX(-14deg); opacity:0; }
  #slash.go{ animation:slash .72s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes slash{ 0%{opacity:1; transform:translateX(-360px) skewX(-14deg);}
    92%{opacity:1;} 100%{opacity:0; transform:translateX(2200px) skewX(-14deg);} }

  h2.bt{ font-family:var(--display); font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; line-height:.94; text-wrap:balance; }
  .chip{ display:inline-flex; align-items:center; font-family:var(--body); font-weight:800;
    font-size:17px; letter-spacing:.24em; text-transform:uppercase; padding:9px 18px;
    border-radius:6px; background:var(--navy); color:#DDE6FA; }
  .chip.org{ background:var(--orange-deep); color:#FFE2CF; }
  .unit{ font-family:var(--display); font-weight:500; color:var(--muted); text-transform:uppercase; }
  .num{ font-variant-numeric:tabular-nums; }

  /* ── Leaderboard board ── */
  .lb{ flex-direction:row; gap:0; padding:0; }
  .lb .lead{ width:760px; flex:none; display:flex; flex-direction:column; padding:56px 64px 48px;
    background:linear-gradient(160deg,rgba(232,83,10,.16),rgba(232,83,10,.03) 55%),
      linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border-right:1px solid var(--line); position:relative; overflow:hidden; }
  .lb .lead .wm{ position:absolute; right:-130px; bottom:-150px; width:560px; opacity:.07;
    filter:grayscale(1) brightness(3); pointer-events:none; }
  .lb .lead .st{ font-size:60px; margin-top:18px; }
  .lb .lead .who{ margin-top:auto; }
  .lb .lead .who .rk{ font-family:var(--display); font-weight:600; font-size:22px;
    letter-spacing:.3em; color:var(--orange-hot); text-transform:uppercase; }
  .lb .lead .who .nm{ font-family:var(--display); font-weight:700; font-size:84px;
    line-height:1; text-transform:uppercase; margin-top:10px; }
  .lb .lead .who .tm{ font-size:23px; font-weight:700; letter-spacing:.2em; color:#AEB6C2;
    text-transform:uppercase; margin-top:14px; }
  .lb .lead .val{ display:flex; align-items:baseline; gap:18px; margin-top:26px; }
  .lb .lead .val b{ font-family:var(--display); font-weight:700; font-size:218px; line-height:.85;
    color:var(--orange-hot); letter-spacing:-.01em; }
  .lb .lead .val .unit{ font-size:44px; }
  .lb .rows{ flex:1; display:flex; flex-direction:column; padding:40px 64px 36px; }
  .lb .rows .hd{ display:flex; align-items:baseline; padding:0 8px 18px;
    font-size:16px; font-weight:800; letter-spacing:.3em; text-transform:uppercase; color:#AEB6C2; }
  .lb .rows .hd .r{ margin-left:auto; }
  .lb .row{ flex:1; display:flex; align-items:center; gap:26px; padding:0 8px;
    border-top:1px solid var(--line-soft); }
  .lb .row:last-child{ border-bottom:1px solid var(--line-soft); }
  .lb .row .rk{ font-family:var(--mono); font-weight:700; font-size:26px; color:var(--muted); width:56px; }
  .lb .row .nm{ font-family:var(--display); font-weight:600; font-size:40px; text-transform:uppercase; }
  .lb .row .tm{ font-size:19px; font-weight:700; letter-spacing:.14em; color:#AEB6C2;
    text-transform:uppercase; }
  .lb .row .v{ margin-left:auto; font-family:var(--display); font-weight:600; font-size:48px; }
  .lb .row .d{ font-family:var(--mono); font-size:19px; color:var(--muted); width:120px; text-align:right; }

  /* ── PR takeover ── */
  .board.pr{ padding:0; background:
      linear-gradient(118deg,var(--orange-deep) 0%,var(--orange) 46%,var(--orange-hot) 100%);
    color:#180A02; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; }
  .board.pr .wm{ position:absolute; left:50%; top:50%; width:1180px; transform:translate(-50%,-50%);
    opacity:.10; pointer-events:none; }
  .board.pr .flag{ font-family:var(--display); font-weight:700; font-size:30px; letter-spacing:.5em;
    text-transform:uppercase; color:#33150A; }
  .board.pr .big{ font-family:var(--display); font-weight:700; font-size:150px; line-height:.95;
    text-transform:uppercase; margin-top:10px; color:#120701; }
  .board.pr .stn{ font-family:var(--display); font-weight:600; font-size:44px; letter-spacing:.14em;
    text-transform:uppercase; margin-top:22px; color:#3B1A0C; }
  .board.pr .vals{ display:flex; align-items:baseline; gap:44px; margin-top:26px; }
  .board.pr .old{ font-family:var(--display); font-weight:500; font-size:70px; color:#5A2D16;
    text-decoration:line-through; text-decoration-thickness:6px; }
  .board.pr .arrow{ font-family:var(--display); font-size:64px; color:#33150A; }
  .board.pr .new{ font-family:var(--display); font-weight:700; font-size:190px; line-height:.9; color:#FFF6EE;
    text-shadow:0 10px 40px rgba(0,0,0,.28); }
  .board.pr .new .unit{ font-size:52px; color:#FFD9BE; margin-left:14px; }

  /* ── Combine card ── */
  .cc{ padding:0; }
  .cc .id{ width:640px; flex:none; position:relative; overflow:hidden; display:flex;
    flex-direction:column; padding:56px 60px 48px;
    background:linear-gradient(200deg,rgba(35,53,102,.55),rgba(35,53,102,.08) 60%),
      linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border-right:1px solid var(--line); }
  .cc .id .wm{ position:absolute; right:-170px; bottom:-140px; width:620px; opacity:.08;
    pointer-events:none; }
  .cc .id .no{ font-family:var(--display); font-weight:700; font-size:150px; line-height:1;
    color:var(--orange-hot); }
  .cc .id .no small{ font-size:40px; color:var(--muted); font-weight:500; margin-right:6px; }
  .cc .id .nm{ font-family:var(--display); font-weight:700; font-size:88px; line-height:.96;
    text-transform:uppercase; margin-top:8px; }
  .cc .id .meta{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  .cc .id .foot{ margin-top:auto; font-size:18px; font-weight:700; letter-spacing:.22em;
    text-transform:uppercase; color:var(--muted); }
  .cc .grid{ flex:1; display:grid; grid-template-columns:1fr 1fr 1fr; }
  .cc .col{ padding:44px 44px 36px; display:flex; flex-direction:column; }
  .cc .col + .col{ border-left:1px solid var(--line-soft); }
  .cc .col .gh{ font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--orange-hot); padding-bottom:16px;
    border-bottom:1px solid var(--line); }
  .cc .m{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:9px;
    border-bottom:1px solid var(--line-soft); }
  .cc .m:last-child{ border-bottom:0; }
  .cc .m .l{ display:flex; align-items:baseline; }
  .cc .m .l .lab{ font-size:18px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:#AEB6C2; }
  .cc .m .l .v{ margin-left:auto; font-family:var(--display); font-weight:600; font-size:40px;
    line-height:1; }
  .cc .m .l .v .unit{ font-size:18px; margin-left:5px; }
  .cc .m .bar{ height:7px; background:var(--line-soft); border-radius:99px; overflow:hidden; }
  .cc .m .bar i{ display:block; height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--orange-deep),var(--orange-hot));
    transform:scaleX(0); transform-origin:left;
    transition:transform .9s cubic-bezier(.16,1,.3,1); }
  .cc .m .bar i.cold{ background:var(--navy-hi); }

  /* ── Most improved ── */
  .mi{ flex-direction:column; }
  .mi .hd{ display:flex; align-items:center; gap:26px; }
  .mi .hd .bt{ font-size:64px; }
  .mi .hd .sub{ font-size:18px; font-weight:700; letter-spacing:.22em; color:var(--muted);
    text-transform:uppercase; margin-left:auto; }
  .mi .list{ flex:1; display:flex; flex-direction:column; margin-top:30px; }
  .mi .row{ flex:1; display:flex; align-items:center; gap:38px; border-top:1px solid var(--line-soft);
    padding:0 10px; }
  .mi .row:last-child{ border-bottom:1px solid var(--line-soft); }
  .mi .delta{ width:330px; flex:none; font-family:var(--display); font-weight:700; font-size:76px;
    color:var(--orange-hot); }
  .mi .who .nm{ font-family:var(--display); font-weight:600; font-size:44px; text-transform:uppercase; }
  .mi .who .st{ font-size:19px; font-weight:700; letter-spacing:.16em; color:#AEB6C2;
    text-transform:uppercase; margin-top:6px; }
  .mi .then{ margin-left:auto; display:flex; align-items:baseline; gap:20px;
    font-family:var(--display); }
  .mi .then .a{ font-weight:500; font-size:40px; color:var(--muted); }
  .mi .then .ar{ font-size:30px; color:var(--orange); }
  .mi .then .b{ font-weight:700; font-size:56px; }

  /* ── Records wall ── */
  .rw{ flex-direction:column; }
  .rw .hd{ display:flex; align-items:center; gap:26px; }
  .rw .hd .bt{ font-size:64px; }
  .rw .grid{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); margin-top:34px;
    border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .rw .cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:20px 28px 16px; display:flex; flex-direction:column; justify-content:center; }
  .rw .cell .st{ font-size:20px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:#AEB6C2; }
  .rw .cell .v{ font-family:var(--display); font-weight:700; font-size:52px; line-height:1.05;
    margin-top:6px; }
  .rw .cell .v .unit{ font-size:19px; }
  .rw .cell .who{ font-family:var(--display); font-weight:500; font-size:25px; color:var(--orange-hot);
    text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }

  /* ── Today at the Combine ── */
  .td{ flex-direction:column; }
  .td .hd{ display:flex; align-items:center; gap:26px; }
  .td .hd .bt{ font-size:64px; }
  .td .stats{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); margin-top:34px;
    border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .td .cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  .td .cell .v{ font-family:var(--display); font-weight:700; font-size:168px; line-height:1;
    color:var(--orange-hot); }
  .td .cell .lab{ font-size:21px; font-weight:800; letter-spacing:.24em; text-transform:uppercase;
    color:#AEB6C2; }
  .td .prlist{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:26px;
    font-family:var(--display); font-size:30px; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; }
  .td .prlist .flag{ font:800 16px/1 var(--body); letter-spacing:.1em; color:#120701;
    background:var(--orange-hot); border-radius:5px; padding:6px 12px; }

  /* ── Waiting board (live mode, no results yet) ── */
  .board.wait{ flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; }
  .board.wait .logo{ width:190px; height:190px; object-fit:contain; margin-bottom:14px;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  .board.wait .bt{ font-size:92px; }
  .board.wait .sub{ font-size:24px; font-weight:600; color:var(--muted); max-width:900px;
    line-height:1.5; }
  .board.wait .chips{ display:flex; gap:12px; margin-top:22px; }

  /* ── Ticker ── */
  #ticker{ position:relative; z-index:3; height:96px; flex:none; display:flex; align-items:stretch;
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border-top:1px solid var(--line); }
  #ticker .tag{ flex:none; display:flex; align-items:center; gap:12px; padding:0 30px;
    background:linear-gradient(115deg,var(--orange-deep),var(--orange));
    font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:.3em;
    text-transform:uppercase; color:#FFF3E9; clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%);
    padding-right:56px; }
  #tickerview{ flex:1; overflow:hidden; display:flex; align-items:center; }
  #tickertrack{ display:flex; align-items:center; white-space:nowrap;
    animation:tick 46s linear infinite; }
  .tcopy{ display:flex; align-items:center; gap:64px; padding-right:64px; }
  .chev{ width:.62em; height:.72em; fill:currentColor; }
  @keyframes tick{ to{ transform:translateX(-50%); } }
  .tk{ display:inline-flex; align-items:baseline; gap:16px; font-family:var(--mono); font-size:27px; }
  .tk .who{ color:var(--cream); font-weight:700; }
  .tk .what{ color:var(--muted); }
  .tk .val{ color:var(--cream); font-weight:700; }
  .tk .ag{ color:#93A9E4; font-weight:700; }
  .tk.pr .val,.tk.pr .who{ color:var(--orange-hot); }
  .tk .flag{ font-weight:700; color:#120701; background:var(--orange-hot); border-radius:5px;
    padding:3px 10px; font-size:19px; letter-spacing:.1em; }

  /* ── Demo controls (mockup only, auto-hide) ── */
  #demo{ position:absolute; right:26px; bottom:96px; z-index:9; display:flex; gap:8px;
    opacity:0; pointer-events:none; transition:opacity .3s; }
  #demo.show{ opacity:1; pointer-events:auto; }
  #demo button{ font:700 12px/1 var(--body); letter-spacing:.14em; text-transform:uppercase;
    color:var(--cream); background:rgba(18,22,28,.92); border:1px solid var(--line);
    border-radius:8px; padding:11px 16px; cursor:pointer; }
  #demo button:hover{ border-color:var(--orange); color:var(--orange-hot); }
  #demo button:focus-visible{ outline:2px solid var(--orange-hot); outline-offset:2px; }
  #demo button[aria-pressed="true"]{ background:var(--orange-deep); border-color:var(--orange);
    color:#FFE2CF; }

  @media (prefers-reduced-motion:reduce){
    #tickertrack{ animation:none; }
    .board.entering{ clip-path:none !important; }
    #slash{ display:none; }
    .cc .m .bar i{ transition:none; transform:none; }
  }
</style>

/* Display names are first name + single last initial (minors on a semi-public
   screen). Same-initial kids stay ambiguous on purpose — the team tag and
   jersey number shown beside every name tell them apart. */
const PLAYERS = [];
for (const t of TEAMS){ for (const [num, full] of t.players){
  const parts = full.replace(/\s+(Jr\.?|Sr\.?|II|III)$/i,'').trim().split(/\s+/);
  const lastw = parts[parts.length-1];
  PLAYERS.push({ id:'p'+PLAYERS.length, full, name:`${parts[0]} ${lastw[0]}.`, lastw,
    num, div:t.div, team:t.team, short:t.short, age: divByKey[t.div].age });
} }

/* DATA[pid][sid] = {best, prev} — prev is the best from before the improvement
   window (null when a player has no earlier baseline). FEED = recent results,
   newest first. Both are rebuilt by buildDemo() or by every live refresh. */
let DATA = {};
let FEED = [];
let TODAY = null;   // live mode only: {tests, kids, prs, divs, prNames} for today's submissions

function buildDemo(){
  const bias = Object.fromEntries(PLAYERS.map(p => [p.id, rBetween(0.12,0.88)]));
  DATA = {};
  for (const p of PLAYERS){ DATA[p.id] = {};
    for (const s of STATIONS){
      if (!eligible(s, p.age)) continue;
      const [lo,hi] = rangeFor(s, p.age);
      const t = Math.min(1, Math.max(0, bias[p.id] + rBetween(-0.22,0.22)));
      const best = lo + t*(hi-lo);
      const drift = (hi-lo) * rBetween(0.02,0.14);          // improvement over the window
      const prev  = s.dir > 0 ? Math.max(0, best - drift) : best + drift;
      DATA[p.id][s.id] = { best:+best.toFixed(s.dec), prev:+prev.toFixed(s.dec) };
    }
  }
  FEED = [];
  const shuffled = [...PLAYERS].sort(()=>seedrand()-.5);
  shuffled.slice(0,22).forEach((p,i) => {
    const opts = STATIONS.filter(s => eligible(s, p.age));
    const s = opts[Math.floor(seedrand()*opts.length)];
    const d = DATA[p.id][s.id];
    const isPR = (d.best - d.prev) * s.dir > 0 && i % 3 !== 1;
    FEED.push({ p, s, v:d.best, prev:d.prev, isPR, when: i<12 ? 'TODAY' : 'YESTERDAY' });
  });
}

const fmt = (v,s) => v.toFixed(s.dec);
const hasData = (p, sid) => !!(DATA[p.id] && DATA[p.id][sid]);
const leaders = (sid, divKey) => PLAYERS.filter(p=>p.div===divKey && hasData(p, sid))
  .map(p => ({ p, v: DATA[p.id][sid].best }))
  .sort((a,b) => (b.v-a.v) * stationById[sid].dir);
const pct = (pid, sid) => { const p = PLAYERS.find(x=>x.id===pid);
  const board = leaders(sid, p.div); if (board.length < 2) return 100;
  const i = board.findIndex(r=>r.p.id===pid);
  return Math.round(100 * (board.length-1-i) / (board.length-1)); };

/* ════════ Rotation ════════ */
let ZONE = ['all','pitch','hit','ath'].includes(params.get('zone')) ? params.get('zone') : 'all';
const SECS = Math.max(6, +params.get('secs') || 12);
const zoneStations = () => STATIONS.filter(s => ZONE==='all' || s.g===ZONE);
const zoneLabel = { all:'Facility', pitch:'Pitching Lab', hit:'Hitting Bays', ath:'Athletic Testing' };

/* Boards only exist where data exists: in live mode a (station, division)
   leaderboard needs at least one tested player; demo data covers everything. */
const lbCombos = () => {
  const out = [];
  for (const s of zoneStations())
    for (const d of DIVS){
      if (!eligible(s, d.age)) continue;
      if (!DEMO && !leaders(s.id, d.key).length) continue;
      out.push({ s, div: d });
    }
  return out;
};
const testedPlayers = () => PLAYERS.filter(p => DATA[p.id] && Object.keys(DATA[p.id]).length);

function* schedule(){
  let li=0, ai=0, pi=0, fi=0, ri=0, n=0;
  while (true){
    const combos = lbCombos();
    if (!combos.length){ yield { kind:'wait' }; continue; }
    // pick the station first, then rotate through the divisions that have it
    const sts = [...new Set(combos.map(c=>c.s))];
    const s = sts[li++ % sts.length];
    const divs = combos.filter(c=>c.s===s).map(c=>c.div);
    yield { kind:'lb', s, div: divs[ai++ % divs.length] };
    n++;
    if (n % 2 === 0){
      // celebrate a PR for ~48h, then it retires to the record books
      const freshPR = f => !f.t || (Date.now() - f.t.getTime()) < 172800000;
      const prs = FEED.filter(f=>f.isPR && freshPR(f) && (ZONE==='all' || f.s.g===ZONE));
      if (prs.length) yield { kind:'pr', f: prs[pi++ % prs.length] };
    }
    if (n % 2 === 1){
      const pool = testedPlayers();
      if (pool.length) yield { kind:'cc', p: pool[fi++ % pool.length] };
    }
    if (n % 3 === 0){
      const div = DIVS[ri++ % DIVS.length];
      if (zoneStations().filter(x => eligible(x, div.age) && leaders(x.id, div.key).length).length >= 3)
        yield { kind:'rw', div };
    }
    if (n % 3 === 2 && TODAY && TODAY.tests) yield { kind:'td' };
    if (n % 4 === 0 && miRows().length) yield { kind:'mi' };
  }
}
let gen = schedule();

/* improvement rows: needs a pre-window baseline (prev) and a positive gain */
function miRows(){
  const all = PLAYERS.flatMap(p => zoneStations().filter(s => eligible(s, p.age) && hasData(p, s.id)).map(s => {
    const d = DATA[p.id][s.id];
    if (d.prev == null) return null;
    const gain = (d.best - d.prev) * s.dir;
    const [lo,hi] = rangeFor(s, p.age);
    return { p, s, d, gain, norm: gain / (hi - lo) };
  })).filter(r => r && r.gain > 0).sort((a,b)=>b.norm-a.norm);
  const seen = new Set(), rows = [];
  for (const r of all){ if (!seen.has(r.p.id)){ seen.add(r.p.id); rows.push(r);
    if (rows.length === 5) break; } }
  return rows;
}

/* ════════ Board swap + motion ════════ */
const boardsEl = document.getElementById('boards');
const slash = document.getElementById('slash');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function countUps(root){
  if (reduced) { root.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'); return; }
  root.querySelectorAll('[data-count]').forEach(n=>{
    const target = +n.dataset.count, dec = +n.dataset.dec;
    const unit = n.querySelector('.unit'); const unitHTML = unit ? unit.outerHTML : '';
    const t0 = performance.now(), dur = 850;
    (function step(t){
      const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(2,-10*k);
      n.innerHTML = (target*e).toFixed(dec) + unitHTML;
      if (k<1) requestAnimationFrame(step);
    })(t0);
  });
  requestAnimationFrame(()=>root.querySelectorAll('.bar i').forEach(b=>b.style.transform=`scaleX(${b.dataset.w/100})`));
}

function show(spec){
  const next = RENDER[spec.kind](spec);
  const prev = boardsEl.firstElementChild;
  next.classList.add('entering');
  boardsEl.appendChild(next);
  if (prev) prev.classList.add('leaving');
  if (!reduced){ slash.classList.remove('go'); void slash.offsetWidth; slash.classList.add('go'); }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.classList.add('in');
    setTimeout(()=>{ if (boardsEl.lastElementChild !== next) return; // a newer show() owns cleanup
      next.classList.remove('entering','in');
      boardsEl.querySelectorAll('.board').forEach(b=>{ if (b!==next) b.remove(); }); }, 760);
  }));
  countUps(next);
}

/* timer + progress */
const bar = document.querySelector('#progress i');
let paused = false, elapsed = 0, last = performance.now();
function tick(t){
  const dt = t - last; last = t;
  if (!paused){
    elapsed += dt;
    if (elapsed >= SECS*1000){ elapsed = 0;
      const spec = gen.next().value;
      const cur = boardsEl.firstElementChild;
      if (!(spec.kind === 'wait' && cur && cur.classList.contains('wait'))) show(spec);
    }
    bar.style.width = (elapsed/(SECS*1000)*100)+'%';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ════════ Live data (published-to-web Results CSV) ════════ */
function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }
    else if (ch === '"') inQ = true;
    else if (ch === ','){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const divByLabel = Object.fromEntries(DIVS.map(d=>[d.label, d]));

/* ── Roster single-sourcing ──
   When the sheet's Rosters tab is published (same dialog as Results, CSV),
   paste its URL here and the SHEET becomes the source of truth for rosters —
   the embedded TEAMS list is only the fallback. ?roster= overrides for testing. */
const ROSTER_SRC = params.get('roster') || '';
function teamShort(team){
  if (team.indexOf('American') >= 0) return 'AMERICAN';
  if (team.indexOf('DCP') === 0) return 'DCP';
  const sp = team.indexOf(' ');
  return (sp > 0 ? team.slice(sp+1) : team).toUpperCase();
}
async function loadRoster(){
  if (!ROSTER_SRC) return;
  try {
    const url = ROSTER_SRC + (ROSTER_SRC.includes('?') ? '&' : '?') + 'cb=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return;
    const rows = parseCSV(await r.text());
    if (!rows.length) return;
    const head = rows[0].map(h => String(h).trim());
    const iD = head.indexOf('Division'), iT = head.indexOf('Team'),
          iJ = head.indexOf('Jersey'), iP = head.indexOf('Player');
    if (iD < 0 || iT < 0 || iJ < 0 || iP < 0) return;
    const list = [];
    for (let i = 1; i < rows.length; i++){
      const row = rows[i];
      if (!row || !row[iP] || !divByKey[String(row[iD]).trim()]) continue;
      list.push({ div: String(row[iD]).trim(), team: String(row[iT]).trim(),
                  num: String(row[iJ]).trim(), full: String(row[iP]).trim() });
    }
    if (list.length < 50) return;   // refuse a suspiciously small roster — keep the fallback
    PLAYERS.length = 0;
    for (const x of list){
      const parts = x.full.replace(/\s+(Jr\.?|Sr\.?|II|III)$/i,'').trim().split(/\s+/);
      const lastw = parts[parts.length-1] || x.full;
      PLAYERS.push({ id:'p'+PLAYERS.length, full: x.full, name: `${parts[0]} ${lastw[0]}.`,
        lastw, num: x.num, div: x.div, team: x.team, short: teamShort(x.team),
        age: divByKey[x.div].age });
    }
  } catch (e){}
}

const extraPlayers = {};
/* Results rows carry full names; match them to the embedded roster (which owns
   the privacy-safe display names). Unknown names (roster changes) still work. */
function playerFor(divKey, fullName, team, jersey){
  const norm = fullName.trim().toLowerCase();
  let p = PLAYERS.find(x => x.div === divKey && x.full.toLowerCase() === norm);
  if (p) return p;
  const k = divKey + '|' + norm;
  if (extraPlayers[k]) return extraPlayers[k];
  const parts = fullName.replace(/\s+(Jr\.?|Sr\.?|II|III)$/i,'').trim().split(/\s+/);
  const lastw = parts[parts.length-1] || fullName;
  p = { id:'x' + Object.keys(extraPlayers).length, full: fullName,
        name: `${parts[0]} ${(lastw[0]||'').toUpperCase()}.`, lastw,
        num: jersey || '', div: divKey, team: team || '',
        short: (team || '').toUpperCase(), age: divByKey[divKey].age };
  extraPlayers[k] = p; PLAYERS.push(p);
  return p;
}

function whenLabel(t){
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (t >= d0) return 'TODAY';
  if (t >= new Date(d0.getTime() - 864e5)) return 'YESTERDAY';
  return (t.getMonth()+1) + '/' + t.getDate();
}

function applyRows(rows){
  if (!rows.length) return false;
  const head = rows[0].map(h => String(h).trim());
  const iT = head.indexOf('Timestamp'), iD = head.indexOf('Division'),
        iTeam = head.indexOf('Team'), iJ = head.indexOf('Jersey'),
        iP = head.indexOf('Player'), iS = head.indexOf('Station'),
        iV = head.indexOf('Value');
  if (iT < 0 || iD < 0 || iP < 0 || iS < 0 || iV < 0) return false;

  const entries = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    if (!row || !row[iP]) continue;
    const div = divByLabel[String(row[iD]).trim()]; if (!div) continue;
    const s = stationById[String(row[iS]).trim()]; if (!s) continue;
    const v = parseFloat(row[iV]); if (!isFinite(v)) continue;
    let t = new Date(row[iT]); if (isNaN(t)) t = new Date();
    entries.push({ t, div, s, v,
      p: playerFor(div.key, String(row[iP]),
                   iTeam >= 0 ? String(row[iTeam]) : '', iJ >= 0 ? String(row[iJ]) : '') });
  }

  // history per player+station → all-time best + pre-window baseline
  const hist = {};
  for (const e of entries){ const k = e.p.id + '|' + e.s.id;
    (hist[k] = hist[k] || []).push(e); }
  const cutoff = Date.now() - IMPROVE_DAYS * 864e5;
  const newData = {};
  for (const key in hist){
    const list = hist[key].sort((a,b) => a.t - b.t);
    const s = list[0].s, pid = list[0].p.id;
    const bestOf = arr => arr.reduce((m,e) => (e.v - m) * s.dir > 0 ? e.v : m, arr[0].v);
    const older = list.filter(e => e.t.getTime() < cutoff);
    (newData[pid] = newData[pid] || {})[s.id] = { best: bestOf(list), prev: older.length ? bestOf(older) : null };
  }

  // recent feed with true PR detection (a PR needs at least one earlier mark to beat)
  const sorted = [...entries].sort((a,b) => b.t - a.t);
  const newFeed = sorted.slice(0, 20).map(e => {
    const earlier = hist[e.p.id + '|' + e.s.id].filter(x => x.t < e.t);
    const isPR = earlier.length > 0 && earlier.every(x => (e.v - x.v) * e.s.dir > 0);
    const prevBest = earlier.length
      ? earlier.reduce((m,x) => (x.v - m) * e.s.dir > 0 ? x.v : m, earlier[0].v) : null;
    return { p: e.p, s: e.s, v: e.v, prev: prevBest, isPR, when: whenLabel(e.t), t: e.t };
  });

  // today's summary for the "Today at the Combine" board
  const todayEntries = entries.filter(e => whenLabel(e.t) === 'TODAY');
  let prCount = 0; const prNames = [];
  for (const e of todayEntries){
    const earlier = hist[e.p.id + '|' + e.s.id].filter(x => x.t < e.t);
    if (earlier.length && earlier.every(x => (e.v - x.v) * e.s.dir > 0)){
      prCount++;
      if (prNames.indexOf(e.p.name) < 0) prNames.push(e.p.name);
    }
  }
  TODAY = todayEntries.length ? {
    tests: todayEntries.length,
    kids: new Set(todayEntries.map(e => e.p.id)).size,
    prs: prCount,
    divs: new Set(todayEntries.map(e => e.div.key)).size,
    prNames: prNames.slice(0, 8)
  } : null;

  DATA = newData; FEED = newFeed;
  renderTicker();
  // first data after the waiting board: swap to real content right away
  const cur = boardsEl.firstElementChild;
  if (cur && cur.classList.contains('wait') && lbCombos().length){
    elapsed = 0; show(gen.next().value);
  }
  return true;
}

const statusEl = document.getElementById('status');
let lastSync = null;   // time of the last successful data refresh
function syncLabel(){
  if (!lastSync) return 'NO DATA YET';
  const h = lastSync.getHours() % 12 || 12;
  return 'LAST ' + h + ':' + String(lastSync.getMinutes()).padStart(2,'0');
}
function setStatus(mode){
  if (DEMO){ statusEl.textContent = 'SAMPLE DATA'; return; }
  // healthy needs no timestamp (it would just mirror the clock); a stale feed does
  if (mode === 'live'){ lastSync = new Date(); statusEl.textContent = 'LIVE'; }
  else if (mode === 'badfeed') statusEl.textContent = 'CHECK FEED · ' + syncLabel();
  else statusEl.textContent = 'OFFLINE · ' + syncLabel();
}

let fetchSeq = 0;
async function refresh(){
  const seq = ++fetchSeq;
  try {
    const ctl = new AbortController();
    const kill = setTimeout(() => ctl.abort(), 20000);
    const url = SRC + (SRC.includes('?') ? '&' : '?') + 'cb=' + Date.now();
    const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    const text = await r.text();
    clearTimeout(kill);
    if (seq !== fetchSeq) return;   // a newer poll already resolved — never roll back
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // an HTML error page or renamed columns must not masquerade as LIVE
    setStatus(applyRows(parseCSV(text)) ? 'live' : 'badfeed');
  } catch (e){ if (seq === fetchSeq) setStatus('offline'); }
}

/* ════════ Fit stage to screen ════════
   Works at any resolution (720p/1080p/4K) — the 1920x1080 stage letterboxes to
   the viewport. ?safe=N shrinks it N% per edge for TVs that overscan HDMI. */
const SAFE = Math.min(6, Math.max(0, +params.get('safe') || 0));
function fit(){
  const k = Math.min(innerWidth/1920, innerHeight/1080) * (1 - SAFE*2/100);
  document.getElementById('stage').style.transform =
    `translate(-50%,-50%) scale(${k})`; }
fit(); addEventListener('resize', fit);

/* ════════ Demo controls (mockup only) ════════ */
const demo = document.getElementById('demo');
let hideT;
function poke(){ demo.classList.add('show'); clearTimeout(hideT);
  hideT = setTimeout(()=>demo.classList.remove('show'), 3500); }
addEventListener('pointermove', poke); addEventListener('pointerdown', poke);
function setZone(z){ ZONE = z; gen = schedule(); elapsed = 0; show(gen.next().value);
  // the zone chip is the "sign" on a filtered TV; the all-boards view needs no sign
  document.getElementById('zonechip').style.display = z === 'all' ? 'none' : 'flex';
  document.getElementById('zonename').textContent = zoneLabel[z];
  demo.querySelectorAll('[data-zone]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.zone===z)));
}
demo.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>setZone(b.dataset.zone)));
document.getElementById('nextbtn').addEventListener('click',()=>{ elapsed=0; show(gen.next().value); });
document.getElementById('pausebtn').addEventListener('click',e=>{
  paused = !paused; e.currentTarget.textContent = paused?'Play':'Pause';
  e.currentTarget.setAttribute('aria-pressed', String(paused)); });
addEventListener('keydown',e=>{
  if (e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); elapsed=0; show(gen.next().value); }
  if (e.key==='p') document.getElementById('pausebtn').click();
  const z = {1:'all',2:'pitch',3:'hit',4:'ath'}[e.key]; if (z) setZone(z);
});

/* ════════ Boot ════════ */
if (DEMO) buildDemo();
renderTicker();
setStatus(DEMO ? 'demo' : 'offline');
setZone(ZONE);
if (!DEMO){
  // roster first so results match against the freshest player list
  loadRoster().then(() => { refresh(); setInterval(refresh, 60000); });
}
</script>
