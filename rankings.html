<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  :root{
    --ink:#07090C; --panel-a:#12161C; --panel-b:#0C0F14; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
    --orange:#E8530A; --orange-hot:#FF7A33; --orange-deep:#B23C05;
    --cream:#F2EEE6; --muted:#8A94A3; --navy:#233566; --gold:#F5C542;
    --display:'Oswald',ui-sans-serif,system-ui,sans-serif; --body:'Inter',ui-sans-serif,system-ui,sans-serif; --mono:'Roboto Mono',ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--ink); color:var(--cream); font-family:var(--body); -webkit-font-smoothing:antialiased; }
  header{ display:flex; align-items:center; gap:14px; padding:14px 22px; background:linear-gradient(180deg,var(--panel-a),var(--panel-b)); border-bottom:1px solid var(--line); }
  header img{ width:42px; height:42px; object-fit:contain; }
  header .t1{ font-family:var(--display); font-weight:700; font-size:21px; letter-spacing:.05em; text-transform:uppercase; flex:1; }
  header .t1 em{ font-style:normal; color:var(--orange-hot); }
  .status{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.16em; color:#FFB58A; border:1px solid rgba(232,83,10,.5); border-radius:6px; padding:6px 10px; background:rgba(232,83,10,.12); }
  main{ max-width:1400px; margin:0 auto; padding:18px 18px 60px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chips button{ font:800 12.5px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--cream); background:var(--panel-a); border:1px solid var(--line); border-radius:99px; padding:9px 15px; cursor:pointer; }
  .chips button small{ font-weight:700; color:var(--muted); margin-left:6px; letter-spacing:0; }
  .chips button[aria-pressed="true"]{ background:var(--orange-deep); border-color:var(--orange); color:#FFE2CF; }
  .chips button[aria-pressed="true"] small{ color:#FFD9BE; }
  .chips.teams button{ font-size:11.5px; padding:7px 13px; background:var(--panel-b); color:var(--muted); }
  .chips.teams button[aria-pressed="true"]{ color:#FFE2CF; }
  .bar{ display:flex; gap:10px; align-items:center; margin:6px 0 14px; flex-wrap:wrap; }
  #search{ flex:1; min-width:200px; font:600 15px var(--body); color:var(--cream); background:var(--panel-b); border:1px solid var(--line); border-radius:10px; padding:11px 14px; outline:none; }
  #search:focus{ border-color:var(--orange); }
  .ghost{ font:700 12px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--cream); background:none; border:1px solid var(--line); border-radius:10px; padding:11px 16px; cursor:pointer; }
  .ghost:hover{ border-color:var(--orange); color:var(--orange-hot); }
  .wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:linear-gradient(180deg,var(--panel-a),var(--panel-b)); }
  table{ border-collapse:separate; border-spacing:0; width:100%; min-width:720px; }
  th{ position:sticky; top:0; z-index:2; background:#151A21; font-family:var(--display); font-weight:600; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; padding:12px 12px 10px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
  th small{ display:block; font:700 9.5px var(--body); letter-spacing:.14em; color:#5E6875; margin-top:2px; }
  th.on{ color:var(--orange-hot); }
  th.on::after{ content:' \25BE'; }
  th.on.asc::after{ content:' \25B4'; }
  th.l, td.l{ text-align:left; }
  th.rk, td.rk{ text-align:center; width:48px; }
  td{ padding:10px 12px; border-bottom:1px solid var(--line-soft); font-family:var(--mono); font-size:15px; font-weight:700; text-align:right; white-space:nowrap; }
  tr:last-child td{ border-bottom:0; }
  td.rk{ font-family:var(--display); font-size:18px; color:var(--orange-hot); }
  td.pn{ font-family:var(--display); font-weight:600; font-size:17px; text-transform:uppercase; letter-spacing:.02em; }
  td.pn small{ font:800 10px var(--body); letter-spacing:.14em; color:var(--muted); margin-left:8px; text-transform:uppercase; }
  td .r{ display:block; font:700 10px var(--body); letter-spacing:.1em; color:#5E6875; margin-top:2px; }
  td.top1 .r{ color:var(--gold); } td.top2 .r, td.top3 .r{ color:var(--orange-hot); }
  td.top1{ color:var(--gold); }
  td.none{ color:#3A4350; font-weight:500; }
  td.ovr{ color:var(--cream); }
  td.ovr b{ color:var(--orange-hot); }
  .note{ color:var(--muted); font-size:13px; font-weight:600; margin-top:12px; line-height:1.55; }
  .empty{ padding:40px; text-align:center; color:var(--muted); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  @media print{ body{ background:#fff; color:#000; } header, .bar, .chips{ display:none; } .wrap{ border:0; background:none; } th{ position:static; background:#eee; color:#000; } td{ color:#000; } td.rk, td.top1, td.ovr b{ color:#000; } }
</style>

<header>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const CONFIG_SRC = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOx0py80kbfpe43IlhJFlMnZT2ZO38KYffmwLZBcSaMEHG_GPUoRBzLXOMLJAonQ3syTDL0Fui4EBU/pub?gid=0&single=true&output=csv';
const SRC = params.get('src') || CONFIG_SRC;
const DEMO = params.get('demo') === '1';
const ROSTER_SRC = params.get('roster') || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOx0py80kbfpe43IlhJFlMnZT2ZO38KYffmwLZBcSaMEHG_GPUoRBzLXOMLJAonQ3syTDL0Fui4EBU/pub?gid=1951964958&single=true&output=csv';
const MIN_TM = 11;

const STATIONS = [
  { id:'fb',    g:'pitch', young:true, name:'Pitch Velocity',  unit:'MPH', dec:1, dir:+1, rng:{8:[36,50],18:[76,92]} },
  { id:'spin',  g:'pitch', name:'Spin Rate',           unit:'RPM', dec:0, dir:+1, rng:{11:[1450,1950],18:[2000,2500]} },
  { id:'ivb',   g:'pitch', name:'Induced Vert Break',  unit:'IN',  dec:1, dir:+1, rng:{11:[7,13],18:[13,20]} },
  { id:'mvmt',  g:'pitch', name:'Horizontal Break',    unit:'IN',  dec:1, dir:+1, rng:{11:[7,13],18:[11,18]} },
  { id:'ev',    g:'hit',   name:'Exit Velocity',       unit:'MPH', dec:1, dir:+1, rng:{11:[52,70],18:[82,102]} },
  { id:'bat',   g:'hit',   name:'Bat Speed',           unit:'MPH', dec:1, dir:+1, rng:{11:[42,58],18:[64,78]} },
  { id:'la',    g:'hit',   name:'Best Launch Angle',   unit:'DEG', dec:0, dir:+1, rng:{11:[8,24],18:[12,28]} },
  { id:'dist',  g:'hit',   name:'Max Distance',        unit:'FT',  dec:0, dir:+1, rng:{11:[130,210],18:[270,380]} },
  { id:'push',  g:'ath', young:true, name:'Push-Ups &#183; 30 Sec', unit:'REPS',dec:0, dir:+1, rng:{8:[10,24],18:[28,46]} },
  { id:'pull',  g:'ath', young:true, name:'Pull-Ups &#183; Max',    unit:'REPS',dec:0, dir:+1, rng:{8:[0,8],18:[6,20]} },
  { id:'grip',  g:'ath', young:true, name:'Grip Strength',     unit:'LBS', dec:0, dir:+1, rng:{8:[30,55],18:[100,145]} },
  { id:'broad', g:'ath', young:true, name:'Broad Jump',        unit:'IN',  dec:0, dir:+1, rng:{8:[45,66],18:[85,110]} },
  { id:'vert',  g:'ath', young:true, name:'Vertical Jump',     unit:'IN',  dec:1, dir:+1, rng:{8:[9,16],18:[22,32]} },
  { id:'shut',  g:'ath', young:true, name:'5-10-5 Shuttle',    unit:'SEC', dec:2, dir:-1, rng:{8:[5.7,6.6],18:[4.2,4.9]} },
  { id:'dash',  g:'ath', young:true, name:'30-Yard Dash',      unit:'SEC', dec:2, dir:-1, rng:{8:[5.0,5.9],18:[3.7,4.4]} },
  { id:'split', g:'ath', young:true, name:'10-Yard Split',     unit:'SEC', dec:2, dir:-1, rng:{8:[1.9,2.4],18:[1.45,1.8]} },
  { id:'inf',   g:'arm', young:true, name:'Infield Velo',      unit:'MPH', dec:1, dir:+1, rng:{8:[35,48],18:[70,85]} },
  { id:'ofv',   g:'arm', young:true, name:'Outfield Velo',     unit:'MPH', dec:1, dir:+1, rng:{8:[38,52],18:[75,90]} },
  { id:'cvelo', g:'arm', young:true, name:'Catcher Velo',      unit:'MPH', dec:1, dir:+1, rng:{8:[35,48],18:[68,82]} },
  { id:'pop',   g:'arm', young:true, name:'Catcher Pop Time',  unit:'SEC', dec:2, dir:-1, rng:{8:[2.6,3.2],18:[1.95,2.25]} },
];
const stationById = {}; STATIONS.forEach(s => stationById[s.id] = s);
const eligible = (s, age) => !!s.young || age >= MIN_TM;
const rangeFor = (s, age) => {
  const ks = Object.keys(s.rng).map(Number).sort((x,y)=>x-y);
  const a = ks[0], b = ks[1];
  const t = Math.min(1, Math.max(0, (age-a)/(b-a)));
  return [ s.rng[a][0] + t*(s.rng[b][0]-s.rng[a][0]),
           s.rng[a][1] + t*(s.rng[b][1]-s.rng[a][1]) ];
};
const DIVS = [
  {key:'8U',  label:'8U',  age:8},  {key:'9U',  label:'9U',  age:9},
  {key:'10U', label:'10U', age:10}, {key:'11U', label:'11U', age:11},
  {key:'12U', label:'12U', age:12}, {key:'13U', label:'13U', age:13},
  {key:'14U', label:'14U', age:14}, {key:'15U', label:'15U', age:15},
  {key:'16U', label:'16U', age:16},
  {key:'17/18U', label:'17/18U', age:17},
  {key:'DCP2030', label:'DCP 2030', age:14},
  {key:'DCP2029', label:'DCP 2029', age:15},
  {key:'DCP2028', label:'DCP 2028', age:16},
  {key:'DCPScout', label:'DCP Scout', age:18},
];
const divByKey = {}; DIVS.forEach(d => divByKey[d.key] = d);
const divByLabel = {}; DIVS.forEach(d => divByLabel[d.label] = d);
divByLabel['DCP 15U'] = divByKey['DCP2030']; divByLabel['DCP 17U'] = divByKey['DCP2028'];   // pre-pooling labels
const SHORT = { fb:'Velo', spin:'Spin', ivb:'IVB', mvmt:'HB', ev:'Exit V', bat:'Bat', la:'Launch', dist:'Dist', push:'Push', pull:'Pull', grip:'Grip', broad:'Broad', vert:'Vert', shut:'5-10-5', dash:'30 YD', split:'10 YD', inf:'INF Velo', ofv:'OF Velo', cvelo:'C Velo', pop:'Pop' };
const ftin = n => { const t = Math.round(n); return Math.floor(t / 12) + "'" + (t % 12) + '"'; };
const fmt = (v, s) => s.id === 'broad' ? ftin(+v) : (+v).toFixed(s.dec);
const unitOf = s => s.id === 'broad' ? 'FT IN' : s.unit;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function teamShort(team){
  if (team.indexOf('DCP') === 0){
    const toks = team.split(/\s+/).slice(1);
    const rest = toks.filter(t => !/^(\d{4}|\d+U)$/i.test(t)).join(' ');
    const chip = rest || (/^DCP (2028 17U|2030 15U)$/.test(team) ? 'National' : (toks.find(t => /^\d+U$/i.test(t)) || 'DCP'));
    return chip.toUpperCase();
  }
  const sp = team.indexOf(' ');
  return (sp > 0 ? team.slice(sp+1) : team).toUpperCase();
}
function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }
    else if (ch === '"') inQ = true;
    else if (ch === ','){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ---- roster + results ---- */
let PLAYERS = [];
let STATS = {};   // pid -> sid -> {best, n}
const extra = {};
function playerFor(divKey, full, team, jersey){
  const norm = full.trim().toLowerCase();
  let p = PLAYERS.find(x => x.div === divKey && x.full.toLowerCase() === norm);
  if (p) return p;
  const k = divKey + '|' + norm;
  if (!extra[k]){ extra[k] = { id:'x' + Object.keys(extra).length, full: full.trim(), num: jersey || '', div: divKey, team: team || '' }; PLAYERS.push(extra[k]); }
  return extra[k];
}
async function loadRoster(){
  try {
    const r = await fetch(ROSTER_SRC + '&cb=' + Date.now(), { cache:'no-store' });
    const rows = parseCSV(await r.text());
    const head = rows[0].map(h => String(h).trim());
    let iD = head.indexOf('Age Group'); if (iD < 0) iD = head.indexOf('Division');
    const iT = head.indexOf('Team'), iJ = head.indexOf('Jersey'), iP = head.indexOf('Player');
    const out = [];
    for (let i = 1; i < rows.length; i++){ const row = rows[i];
      if (!row || !row[iP] || !divByKey[String(row[iD]).trim()]) continue;
      out.push({ id:'p' + i, div: String(row[iD]).trim(), team: String(row[iT]).trim(), num: String(row[iJ]).trim(), full: String(row[iP]).trim() }); }
    if (out.length > 50) PLAYERS = out;
  } catch(e){}
}
function applyRows(rows){
  const head = rows[0].map(h => String(h).trim());
  let iD = head.indexOf('Age Group'); if (iD < 0) iD = head.indexOf('Division');
  const iTeam = head.indexOf('Team'), iJ = head.indexOf('Jersey'), iP = head.indexOf('Player'), iS = head.indexOf('Station'), iV = head.indexOf('Value');
  if (iD < 0 || iP < 0 || iS < 0 || iV < 0) return false;
  const ns = {};
  for (let r = 1; r < rows.length; r++){
    const row = rows[r]; if (!row || !row[iP]) continue;
    const div = divByLabel[String(row[iD]).trim()]; if (!div) continue;
    const s = stationById[String(row[iS]).trim()]; if (!s) continue;
    let v = parseFloat(row[iV]); if (!isFinite(v)) continue;
    if (s.id === 'mvmt') v = Math.abs(v);
    const p = playerFor(div.key, String(row[iP]), iTeam >= 0 ? String(row[iTeam]) : '', iJ >= 0 ? String(row[iJ]) : '');
    const rec = (ns[p.id] = ns[p.id] || {});
    if (!rec[s.id]) rec[s.id] = { best: v, n: 1 };
    else { rec[s.id].n++; if ((v - rec[s.id].best) * s.dir > 0) rec[s.id].best = v; }
  }
  STATS = ns; return true;
}
async function refresh(){
  try {
    const r = await fetch(SRC + (SRC.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw 0;
    const ok = applyRows(parseCSV(await r.text()));
    setStatus(ok ? 'live' : 'bad'); render();
  } catch(e){ setStatus('offline'); render(); }
}
function buildDemo(){
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  STATS = {};
  PLAYERS.forEach(p => { const bias = 0.15 + rnd() * 0.7;
    STATIONS.forEach(s => { if (!eligible(s, divByKey[p.div].age) || rnd() < 0.25) return;
      const [lo, hi] = rangeFor(s, divByKey[p.div].age); const t = Math.min(1, Math.max(0, bias + (rnd() - .5) * .4));
      (STATS[p.id] = STATS[p.id] || {})[s.id] = { best: +(lo + t * (hi - lo)).toFixed(s.dec), n: 1 + Math.floor(rnd() * 3) }; }); });
}
function setStatus(m){ const el = document.getElementById('status');
  el.textContent = m === 'demo' ? 'SAMPLE DATA' : m === 'live' ? 'LIVE' : m === 'bad' ? 'CHECK FEED' : 'OFFLINE'; }

/* ---- view state ---- */
let DIV = params.get('group') || '', TEAM = '', SORT = 'ovr', ASC = false;
const tested = p => STATS[p.id] && Object.keys(STATS[p.id]).length;

function pctl(p, sid, pool){
  const s = stationById[sid]; const vals = pool.filter(x => STATS[x.id] && STATS[x.id][sid]).map(x => STATS[x.id][sid].best);
  if (vals.length < 2) return 100;
  const mine = STATS[p.id][sid].best;
  const beaten = vals.filter(v => (mine - v) * s.dir > 0).length;
  return Math.round(100 * beaten / (vals.length - 1));
}
function render(){
  // age-group chips with tested counts
  const counts = {}; PLAYERS.forEach(p => { if (tested(p)) counts[p.div] = (counts[p.div] || 0) + 1; });
  if (DIV !== 'ALL' && (!DIV || !divByKey[DIV])) DIV = (DIVS.find(d => counts[d.key]) || DIVS[0]).key;
  const allCount = PLAYERS.filter(tested).length;
  document.getElementById('divchips').innerHTML = `<button data-k="ALL" aria-pressed="${String(DIV === 'ALL')}">All<small>${allCount}</small></button>` + DIVS.map(d =>
    `<button data-k="${d.key}" aria-pressed="${String(d.key === DIV)}">${d.label}<small>${counts[d.key] || 0}</small></button>`).join('');
  document.querySelectorAll('#divchips button').forEach(b => b.onclick = () => { DIV = b.dataset.k; TEAM = ''; render(); });
  const ALL = DIV === 'ALL';
  const div = ALL ? { key:'ALL', label:'All Age Groups', age: 18 } : divByKey[DIV];
  const groupPlayers = PLAYERS.filter(p => (ALL || p.div === DIV) && tested(p));
  const teams = [...new Set(groupPlayers.map(p => p.team))].sort();
  document.getElementById('teamchips').innerHTML = !ALL && teams.length > 1
    ? [{k:'', l:'All Teams'}].concat(teams.map(t => ({k:t, l:teamShort(t)}))).map(t =>
        `<button data-t="${esc(t.k)}" aria-pressed="${String(TEAM === t.k)}">${esc(t.l)}</button>`).join('') : '';
  document.querySelectorAll('#teamchips button').forEach(b => b.onclick = () => { TEAM = b.dataset.t; render(); });

  const sts = STATIONS.filter(s => eligible(s, div.age) && groupPlayers.some(p => STATS[p.id][s.id]));
  const q = document.getElementById('search').value.trim().toLowerCase();
  const rows = groupPlayers.filter(p => (!TEAM || p.team === TEAM) && (!q || p.full.toLowerCase().includes(q))).map(p => {
    const pc = {}; let sum = 0, n = 0;
    sts.forEach(s => { if (STATS[p.id][s.id]){ pc[s.id] = pctl(p, s.id, groupPlayers); sum += pc[s.id]; n++; } });
    return { p, pc, ovr: n ? Math.round(sum / n) : -1, n };
  });
  // per-station rank within the whole group (not just the filtered view)
  const rank = {}; sts.forEach(s => { const order = groupPlayers.filter(p => STATS[p.id][s.id]).sort((a, b) => (STATS[b.id][s.id].best - STATS[a.id][s.id].best) * s.dir);
    rank[s.id] = {}; order.forEach((p, i) => rank[s.id][p.id] = i + 1); });
  rows.sort((a, b) => {
    let d;
    if (SORT === 'ovr') d = b.ovr - a.ovr || b.n - a.n;
    else if (SORT === 'name') d = a.p.full.localeCompare(b.p.full);
    else { const s = stationById[SORT]; const av = STATS[a.p.id][SORT], bv = STATS[b.p.id][SORT];
      if (!av && !bv) d = 0; else if (!av) d = 1; else if (!bv) d = -1; else d = (bv.best - av.best) * s.dir; }
    return ASC ? -d : d;
  });
  const th = (k, label, sub, cls) => `<th class="${cls || ''}${SORT === k ? ' on' : ''}${SORT === k && ASC ? ' asc' : ''}" data-k="${k}">${label}${sub ? `<small>${sub}</small>` : ''}</th>`;
  const html = rows.length ? `<thead><tr><th class="rk">#</th>${th('name', 'Player', '', 'l')}${th('ovr', 'OVR', 'avg pctl')}${sts.map(s => th(s.id, SHORT[s.id], unitOf(s))).join('')}</tr></thead><tbody>` +
    rows.map((r, i) => `<tr><td class="rk">${i + 1}</td>
      <td class="pn l">${esc(r.p.full)}<small>${ALL ? esc(divByKey[r.p.div].label) + ' &#183; ' : ''}${esc(teamShort(r.p.team))}${r.p.num ? ' &#183; #' + esc(r.p.num) : ''}</small></td>
      <td class="ovr">${r.ovr >= 0 ? `<b>${r.ovr}</b><span class="r">${r.n} of ${sts.length} tests</span>` : '&#8212;'}</td>` +
      sts.map(s => { const d = STATS[r.p.id][s.id]; if (!d) return `<td class="none">&#8212;</td>`;
        const rk = rank[s.id][r.p.id]; return `<td class="${rk <= 3 ? 'top' + rk : ''}">${fmt(d.best, s)}<span class="r">#${rk} &#183; ${r.pc[s.id]} pctl</span></td>`; }).join('') + '</tr>').join('') + '</tbody>'
    : `<tr><td class="empty">No results yet for ${esc(div.label)}${TEAM ? ' &#183; ' + esc(teamShort(TEAM)) : ''}</td></tr>`;
  document.getElementById('tbl').innerHTML = html;
  document.querySelectorAll('#tbl th').forEach(h => h.onclick = () => { const k = h.dataset.k; if (!k) return;
    if (SORT === k) ASC = !ASC; else { SORT = k; ASC = k === 'name'; } render(); });
  document.getElementById('foot').innerHTML = rows.length
    ? `${rows.length} player${rows.length === 1 ? '' : 's'} &#183; ${div.label}${TEAM ? ' &#183; ' + esc(teamShort(TEAM)) : ''} &#183; best mark per station &#183; OVR = average percentile across the tests a player has done (vs ${esc(div.label)}) &#183; #1&#8211;3 highlighted &#183; tap a column to sort`
    : '';
  window.__rows = rows; window.__sts = sts;
}
document.getElementById('search').addEventListener('input', render);
document.getElementById('dl').addEventListener('click', () => {
  const rows = window.__rows || [], sts = window.__sts || [];
  const line = a => a.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',');
  const out = [line(['Rank', 'Player', 'Team', 'Jersey', 'OVR pctl'].concat(sts.map(s => s.name.replace(/&#183;/g, '-') + ' (' + s.unit + ')')))];
  rows.forEach((r, i) => out.push(line([i + 1, r.p.full, r.p.team, r.p.num, r.ovr >= 0 ? r.ovr : ''].concat(sts.map(s => STATS[r.p.id][s.id] ? STATS[r.p.id][s.id].best : '')))));
  const blob = new Blob([out.join('\n')], { type:'text/csv' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'combine-rankings-' + (DIV === 'ALL' ? 'All' : divByKey[DIV].label.replace(/[^A-Za-z0-9]+/g, '-')) + '.csv'; a.click();
});

/* ---- boot ---- */
(async () => {
  await loadRoster();
  if (DEMO){ buildDemo(); setStatus('demo'); render(); }
  else { await refresh(); setInterval(refresh, 60000); }
})();
</script>
