<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aces · Scorebug</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
  /* Transparent overlay — only the box paints, so it drops cleanly onto video
     via a YoloBox "Web URL Overlay" or an OBS browser source. */
  :root{
    --line:rgba(255,255,255,.10); --orange:#E8530A; --orange2:#ff7a33;
    --cream:#F2EEE6; --muted:#8a94a3; --blue:#54a6ef; --red:#ef5350;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; }
  body{ font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* The wrap owns screen position so a sponsor plate can dock beside the bug
     (matching the treatment sponsors bought last year). Corner decides which
     side it docks on, so the pair always grows toward the middle of frame. */
  .bug-wrap{ position:fixed; z-index:10; display:none; align-items:flex-end; gap:11px; }
  .bug-wrap.show{ display:flex; }
  /* transform-origin pins scaling to the anchored corner, so a resized bug
     grows into the frame instead of drifting off-screen */
  .bug-wrap.pos-bl{ left:26px; bottom:26px; transform-origin:left bottom; }
  .bug-wrap.pos-br{ right:26px; bottom:26px; flex-direction:row-reverse; transform-origin:right bottom; }
  .bug-wrap.pos-tl{ left:26px; top:26px; align-items:flex-start; transform-origin:left top; }
  .bug-wrap.pos-tr{ right:26px; top:26px; align-items:flex-start; flex-direction:row-reverse; transform-origin:right top; }

  .bug{ display:flex; flex-direction:column; min-width:322px;
    background:linear-gradient(180deg,#12161c,#0c0f14); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:0 12px 34px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; }

  /* ── Sponsors ──────────────────────────────────────────────
     Logos are supplied as transparent PNGs, and most local-business marks are
     dark ink on nothing — so every logo sits on a white plate. That reads on
     any camera feed and matches how these looked on the old broadcast. */
  .sp-dock{ display:none; align-items:center; justify-content:center;
    width:190px; height:76px; padding:9px 13px; background:#fff; border-radius:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.55); flex-shrink:0; }
  .sp-dock.show{ display:flex; }
  .sp-dock img{ max-width:100%; max-height:100%; object-fit:contain;
    opacity:0; transition:opacity .5s ease; }
  .sp-dock img.in{ opacity:1; }
  /* floated plate: its own corner + its own scale, independent of the bug.
     Docked (default) it stays in the wrap and shares the bug's scale. */
  .sp-dock.float{ position:fixed; z-index:10; }
  .sp-dock.float.fp-bl{ left:26px; bottom:26px; transform-origin:left bottom; }
  .sp-dock.float.fp-br{ right:26px; bottom:26px; transform-origin:right bottom; }
  .sp-dock.float.fp-tl{ left:26px; top:26px; transform-origin:left top; }
  .sp-dock.float.fp-tr{ right:26px; top:26px; transform-origin:right top; }

  /* Between-innings card: bigger, centred low, still not a full takeover —
     the game stays visible underneath because we're covering, not cutting. */
  .sp-break{ position:fixed; z-index:11; left:50%; bottom:12%; transform:translate(-50%,14px);
    display:none; flex-direction:column; align-items:center; gap:9px;
    opacity:0; transition:opacity .6s ease, transform .6s ease; }
  .sp-break.show{ display:flex; }
  .sp-break.in{ opacity:1; transform:translate(-50%,0); }
  .sp-break .plate{ display:flex; align-items:center; justify-content:center;
    width:430px; height:180px; padding:26px 34px; background:#fff; border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.65); }
  .sp-break .plate img{ max-width:100%; max-height:100%; object-fit:contain; }
  .sp-break .cap{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:700;
    color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.9); }
  /* the sponsor plate and the due-up panel share the break slot */
  .sp-break .plate.hide, .sp-break .cap.hide, .sp-break .due.hide{ display:none; }

  /* Due up — closes the between-innings break by handing the viewer straight
     back into the game. Themed like the bug, not like a sponsor plate. */
  .due{ min-width:430px; background:linear-gradient(180deg,#12161c,#0c0f14);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.65); }
  .due-h{ display:flex; align-items:baseline; gap:10px; padding:12px 20px 10px;
    border-bottom:1px solid var(--line); }
  .due-h .t{ font-size:13px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); }
  .due-h .team{ font-size:13px; font-weight:700; color:var(--cream); margin-left:auto;
    max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due-row{ display:flex; align-items:center; gap:12px; padding:9px 20px; }
  .due-row + .due-row{ border-top:1px solid rgba(255,255,255,.05); }
  .due-ord{ font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); width:14px; flex-shrink:0; }
  /* Headshot, with the jersey number as the fallback so a missing photo (or an
     opponent we have no photos for) still reads as a deliberate design. */
  .due-pic{ width:44px; height:44px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:#20262f; border:1.5px solid rgba(255,255,255,.14); }
  .due-ph{ width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; background:#20262f;
    border:1.5px solid rgba(255,255,255,.14);
    font-family:ui-monospace,monospace; font-size:14px; font-weight:800; color:var(--orange2); }
  .due-num{ font-family:ui-monospace,monospace; font-size:14px; font-weight:800; color:var(--orange2);
    min-width:32px; }
  .due-name{ font-size:17px; font-weight:700; color:var(--cream); letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .due-pos{ margin-left:auto; font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); }

  /* preview-only standby chip (never shows on the live overlay) */
  .standby{ position:fixed; left:26px; bottom:26px; z-index:9; display:none; align-items:center; gap:9px;
    background:rgba(12,15,20,.92); border:1px solid var(--line); border-radius:10px; padding:11px 15px;
    color:var(--muted); font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .standby.show{ display:flex; }
  .standby .d{ width:9px; height:9px; border-radius:50%; background:var(--orange); animation:sb 1.6s infinite; }
  @keyframes sb{ 0%,100%{opacity:1} 50%{opacity:.3} }

  .bug-top{ display:flex; align-items:stretch; }
  .mod{ display:flex; flex-direction:column; justify-content:center; padding:8px 12px; }
  .bug-top .mod + .mod{ border-left:1px solid var(--line); }
  .teams{ padding:0; }
  .trow{ display:flex; align-items:center; gap:9px; padding:6px 13px 6px 11px; min-width:132px; }
  .trow.aces{ border-left:4px solid var(--orange); }
  .trow.opp{ border-left:4px solid #47505c; border-top:1px solid var(--line); }
  .tlogo{ width:22px; height:22px; border-radius:5px; object-fit:contain; background:rgba(255,255,255,.06); }
  .tlogo.ph{ display:flex; align-items:center; justify-content:center; background:#5a636f; color:#0e1114; font-size:10px; font-weight:800; }
  .tabbr{ font-size:15px; font-weight:800; letter-spacing:.06em; color:var(--cream); width:44px;
    font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif; }
  .tscore{ font-size:21px; font-weight:800; color:#fff; margin-left:auto; min-width:20px; text-align:right;
    font-family:ui-monospace,"SF Mono",monospace; transition:color .2s; }
  .trow.bat .tscore{ color:var(--orange2); }
  .inn{ align-items:center; }
  .inn-tri{ font-size:12px; color:var(--orange); line-height:.7; }
  .inn-num{ font-size:18px; font-weight:800; color:var(--cream); font-family:ui-monospace,monospace; }
  .inn-lbl{ font-size:8px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-top:2px; }
  .count{ gap:4px; }
  .crow{ display:flex; align-items:center; gap:5px; }
  .clbl{ font-size:10.5px; font-weight:800; color:var(--muted); width:10px; font-family:ui-monospace,monospace; }
  .pip{ width:10px; height:10px; border-radius:50%; border:1.5px solid rgba(255,255,255,.22);
    background:transparent; transition:background .12s,border-color .12s; }
  .pip.b{ background:var(--blue); border-color:var(--blue); }
  .pip.s{ background:var(--red); border-color:var(--red); }
  .pip.o{ background:#7f8894; border-color:#7f8894; }
  .bases{ align-items:center; justify-content:center; padding:8px 14px; }
  .diamond{ position:relative; width:38px; height:38px; }
  .base{ position:absolute; width:14px; height:14px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.32); transform:rotate(45deg); transition:background .18s,box-shadow .18s; }
  .base.on{ background:var(--orange); border-color:var(--orange2); box-shadow:0 0 9px rgba(232,83,10,.7); }
  .b1{ right:0; top:50%; margin-top:-7px; }
  .b2{ left:50%; top:0; margin-left:-7px; }
  .b3{ left:0; top:50%; margin-top:-7px; }

  .bug-bot{ display:flex; flex-direction:column; border-top:1px solid var(--line); background:rgba(255,255,255,.02); }
  .minfo{ display:flex; align-items:center; gap:10px; padding:7px 14px; }
  .minfo + .minfo{ border-top:1px solid var(--line); }
  .minfo .tag{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--orange);
    flex-shrink:0; width:56px; }
  .minfo .nm{ font-size:15px; font-weight:700; color:var(--cream); letter-spacing:.01em; white-space:nowrap; }
  .minfo .stat{ margin-left:auto; font-size:12px; color:#c7ccd4; font-family:ui-monospace,"SF Mono",monospace;
    font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:14px; flex-shrink:0; }
  .minfo .stat b{ color:var(--orange2); font-weight:700; }
  /* Arm care (Pitch Smart 13U): tint OUR pitcher's count as it climbs toward
     each rest threshold. Deliberately subtler than the scorer's version —
     this is a broadcast overlay, so it informs without alarming viewers. */
  /* NOTE the default count color is already orange (--orange2), so the scale
     runs yellow -> red rather than amber -> orange; an orange tier would be
     indistinguishable from a normal count. */
  .minfo .stat b.arm-amber{ color:#FACC15; }
  .minfo .stat b.arm-orange{ color:#FB7185; }
  .minfo .stat b.arm-red{ color:#EF4444; }
  .minfo .stat b.arm-max{ color:#fff; background:#dc2626; border-radius:3px; padding:0 5px; }
  .minfo.hide{ display:none; }
  .bug-bot.hide{ display:none; }
</style>
</head>
<body>

<div class="bug-wrap pos-bl" id="bugwrap">
<div class="bug" id="bug">
  <div class="bug-top">
    <div class="mod teams">
      <div class="trow aces" id="rowAces">
        <img class="tlogo" id="acesLogo" src="/icon-192.png" alt="Aces"/><div class="tabbr" id="acesAbbr">DEL</div><div class="tscore" id="scUs">0</div>
      </div>
      <div class="trow opp" id="rowOpp">
        <div class="tlogo ph" id="oppLogo">OP</div><div class="tabbr" id="oppAbbr">OPP</div><div class="tscore" id="scThem">0</div>
      </div>
    </div>
    <div class="mod inn">
      <div class="inn-tri" id="innTri">▲</div>
      <div class="inn-num" id="innNum">1</div>
      <div class="inn-lbl">inning</div>
    </div>
    <div class="mod count">
      <div class="crow"><span class="clbl">B</span><span class="pip" id="b0"></span><span class="pip" id="b1"></span><span class="pip" id="b2"></span></div>
      <div class="crow"><span class="clbl">S</span><span class="pip" id="s0"></span><span class="pip" id="s1"></span></div>
      <div class="crow"><span class="clbl">O</span><span class="pip" id="o0"></span><span class="pip" id="o1"></span></div>
    </div>
    <div class="mod bases">
      <div class="diamond"><div class="base b3" id="base3"></div><div class="base b2" id="base2"></div><div class="base b1" id="base1"></div></div>
    </div>
  </div>
  <div class="bug-bot" id="bugBot">
    <div class="minfo" id="rowPit">
      <span class="tag">Pitching</span><span class="nm" id="pitName">—</span>
      <span class="stat"><b id="pitPC">0</b> P<span id="pitVelo"></span></span>
    </div>
    <div class="minfo" id="rowAB">
      <span class="tag">At bat</span><span class="nm" id="batName">—</span>
      <span class="stat" id="batLine"></span>
    </div>
  </div>
</div>
  <div class="sp-dock" id="spDock"><img id="spDockImg" alt=""/></div>
</div>

<div class="sp-break" id="spBreak">
  <div class="plate" id="spPlate"><img id="spBreakImg" alt=""/></div>
  <div class="cap" id="spBreakCap">Proud sponsor of the Delmarva Aces</div>
  <div class="due hide" id="dueCard">
    <div class="due-h"><span class="t">Due Up</span><span class="team" id="dueTeam"></span></div>
    <div id="dueRows"></div>
  </div>
</div>

<div class="standby" id="standby"><span class="d"></span>Scorebug ready — waiting for a live game</div>

<script>
var db = supabase.createClient(ACES_CONFIG.supabaseUrl, ACES_CONFIG.supabaseKey);

// ── URL switches ────────────────────────────────────────────────────────────
// ?game=<id>     force a specific game (else auto-detect the live one)
// ?pitching=off  hide the pitching line     ?atbat=off  hide the at-bat line
// ?matchup=off   hide both (scoreline only)  ?bases=off  hide the base diamond
// ?pos=bl|br|tl|tr   corner (default bl)     ?debug=1    show even with no live game
// ?fit=N|off     canvas auto-fit: page zooms by width/1920 so 4K/720p outputs
//                match the 1080p look; N forces the multiplier, off disables
// ?scale=N       bug size, 0.5–2 (1 = default; scales the plate too while docked)
// ?sponsors=off  kill both sponsor placements   ?sponsordock=off / ?sponsorbreak=off
// ?sponsorpos=dock|bl|br|tl|tr  float the plate in its own corner (default dock)
// ?sponsorscale=N  floated-plate size, 0.5–2   ?sponsorsecs=N dock rotation seconds
// ?dueup=off     no due-up card between innings ?dueupsecs=N (default 9)
// The pitching and at-bat lines can each be flipped live from overlay.html via
// the game's bug_show_pitching / bug_show_atbat flags. A URL "off" is a hard
// override (always hidden); otherwise the live flag decides.
var Q = new URLSearchParams(location.search);

// Pitching-line velo text. A fresh gun reading beats the pitch row (the row
// only gets its velo after the coach's tap + attach, several seconds later);
// the pitch TYPE is only known from the row, so it's appended when the row
// and the reading describe the same pitch (within 8s). A batted ball's exit
// velo rides along for 12s after contact. lastPitch/radar may be null.
function veloLine(lastPitch, radar, now){
  var txt = '';
  var rT = radar && radar.peak_mph != null ? new Date(radar.ts).getTime() : null;
  var pT = lastPitch ? new Date(lastPitch.created_at).getTime() : null;
  if (rT !== null && (pT === null || rT > pT - 8000)) {
    var samePitch = pT !== null && Math.abs(rT - pT) < 8000;
    txt = ' · ' + radar.peak_mph + (samePitch && lastPitch.pitch_type ? ' ' + lastPitch.pitch_type : '');
  } else if (lastPitch) {
    txt = ' · ' + lastPitch.velocity_mph + (lastPitch.pitch_type ? ' ' + lastPitch.pitch_type : '');
  }
  if (radar && radar.exit_mph != null && now - new Date(radar.ts).getTime() < 12000) txt += ' · 💥 ' + radar.exit_mph;
  return txt;
}
// The overlay is designed against a 1920-wide canvas, but vMix/OBS render the
// browser source at the OUTPUT resolution — on a 4K canvas every element came
// out half-size. Auto-fit zooms the whole page (bug, plate, break card, due-up,
// margins) by width/1920: 1080p = unchanged, 4K = 2x, 720p = proportional.
// The user's size knob multiplies on top. ?fit=N forces it; ?fit=off disables.
(function canvasFit(){
  var f = Q.get('fit');
  if (f === 'off') return;
  function apply(){
    var z = parseFloat(f) || (window.innerWidth / 1920);
    document.body.style.zoom = Math.max(.5, Math.min(4, z));
  }
  apply(); addEventListener('resize', apply);
})();
var urlPitchingOff = Q.get('pitching')==='off' || Q.get('matchup')==='off';
var urlAtbatOff    = Q.get('atbat')==='off'    || Q.get('matchup')==='off';
var DEBUG = Q.get('debug')==='1';

function applyTiers(pitOn, abOn){
  var showPit = pitOn && !urlPitchingOff;
  var showAB  = abOn  && !urlAtbatOff;
  document.getElementById('rowPit').classList.toggle('hide', !showPit);
  document.getElementById('rowAB').classList.toggle('hide', !showAB);
  document.getElementById('bugBot').classList.toggle('hide', !showPit && !showAB);
}

// Size + sponsor-plate placement. URL values are hard overrides; otherwise
// the Controls page (app_settings) drives them live via applyCfg.
var urlScale   = parseFloat(Q.get('scale'))        || null;
var urlSpScale = parseFloat(Q.get('sponsorscale')) || null;
var urlSpPos   = (Q.get('sponsorpos')||'').toLowerCase() || null;
function clampScale(v){ return Math.min(2, Math.max(.5, v)); }
function applyBugScale(v){
  document.getElementById('bugwrap').style.transform =
    (v && v !== 1) ? 'scale(' + clampScale(v) + ')' : '';
}
function applySponsorPlace(pos, scale){
  var d = document.getElementById('spDock');
  var wrap = document.getElementById('bugwrap');
  var corner = ['bl','br','tl','tr'].indexOf(pos) >= 0 ? pos : null;
  d.classList.toggle('float', !!corner);
  d.classList.remove('fp-bl','fp-br','fp-tl','fp-tr');
  if (corner){
    // A transformed ancestor hijacks position:fixed — with the wrap scaled,
    // the "floated" plate anchored to the wrap's corner and sat on top of
    // the bug. Floating means living on <body>, fixed to the real viewport.
    if (d.parentElement !== document.body) document.body.appendChild(d);
    d.classList.add('fp-' + corner);
    d.style.transform = (scale && scale !== 1) ? 'scale(' + clampScale(scale) + ')' : '';
  } else {
    if (d.parentElement !== wrap) wrap.appendChild(d);
    d.style.transform = '';   // docked: rides the wrap and its scale
  }
}

(function initToggles(){
  var pos = (Q.get('pos')||'bl').toLowerCase();
  // position lives on the wrap now (bug + sponsor plate travel together);
  // preserve .show since this can run after the first poll
  var wrap = document.getElementById('bugwrap');
  var wasShown = wrap.classList.contains('show');
  wrap.className = 'bug-wrap pos-' + (['bl','br','tl','tr'].indexOf(pos)>=0?pos:'bl') + (wasShown?' show':'');
  if (Q.get('bases')==='off') document.querySelector('.bases').style.display='none';
  if (urlScale) applyBugScale(urlScale);
  if (urlSpPos || urlSpScale) applySponsorPlace(urlSpPos, urlSpScale);
  applyTiers(true, true); // default until the first poll reads the live flags
})();

var BASERUNNER = /(stolen_base|wp_advance|pb_advance|balk|caught_stealing|pickoff|out_advancing)/i;
var HIT        = /^(single|double|triple|home_run)$/i;
var NOT_AB     = /^(walk|intentional_walk|hbp|sac_fly|sac_bunt)$/i;

// Pitch Smart 13U rest thresholds (mirrors score.html + bullpen.html)
function armTierClass(count){
  if (count >= 95) return 'arm-max';
  if (count >= 66) return 'arm-red';
  if (count >= 51) return 'arm-orange';
  if (count >= 36) return 'arm-amber';
  return '';
}

function teamAbbr(name){
  var w = (name||'').replace(/[^a-zA-Z ]/g,' ').split(/\s+/).filter(Boolean).sort(function(a,b){return b.length-a.length;})[0];
  return (w||'OPP').slice(0,3).toUpperCase();
}
function teamInitials(name){
  var ws = (name||'').replace(/[^a-zA-Z ]/g,' ').split(/\s+/).filter(Boolean);
  var big = ws.slice().sort(function(a,b){return b.length-a.length;})[0]||'OP';
  return big.slice(0,2).toUpperCase();
}
function lastName(full){ return (full||'').trim().split(/\s+/).pop() || full || ''; }

var GAMEID = Q.get('game') || null;
var notesCache = { raw:null, lineup:[], acesPitcherId:null, oppPitcher:'', oppLineup:[] };

function parseNotes(raw){
  if (raw === notesCache.raw) return notesCache;
  notesCache = { raw:raw, lineup:[], acesPitcherId:null, oppPitcher:'', oppLineup:[] };
  try{
    var s = JSON.parse(raw||'{}');
    notesCache.lineup       = s.aces_lineup   || [];
    notesCache.acesPitcherId= s.aces_pitcher_id || null;
    notesCache.acesPitcherName = s.aces_pitcher_name || '';
    notesCache.oppPitcher   = s.opp_pitcher   || '';
    notesCache.oppLineup    = s.opp_lineup    || [];
    // batting-order pointers the scorer publishes (null on pre-pointer games)
    notesCache.curBatterIdx    = (typeof s.cur_batter_idx     === 'number') ? s.cur_batter_idx     : null;
    notesCache.curOppBatterIdx = (typeof s.cur_opp_batter_idx === 'number') ? s.cur_opp_batter_idx : null;
  }catch(e){}
  return notesCache;
}

var busy = false;
async function poll(){
  if (busy) return; busy = true;
  loadCfg();   // fire-and-forget; own 4s throttle
  try{
    // 1) the game row (live state lives here: score, count, bases, inning, half)
    var gq = db.from('games').select('*,opponents(name)');
    var res = GAMEID ? await gq.eq('id',GAMEID).single()
                     : await gq.eq('status','live').order('game_date',{ascending:false}).limit(1).maybeSingle();
    var g = res.data;
    if (!g || (!GAMEID && g.status!=='live' && !DEBUG)){ hideBug(); document.getElementById('standby').classList.toggle('show', DEBUG); return; }
    if (GAMEID && g.status!=='live' && !DEBUG){ /* forced game: still render for testing */ }

    var n = parseNotes(g.notes);
    // half is the TRUE half of the inning; which team it belongs to depends on
    // the side the Aces drew (games.is_home — home bats the bottom).
    var acesHalf = g.is_home ? 'bottom' : 'top';
    var isAcesBatting = ((g.half||'top') === acesHalf);

    // 2) at-bats → who's up + today's line + plate-appearance counts.
    // Classify by HALF vs acesHalf. batter_id can be null on an Aces at-bat
    // when that lineup slot has no name, so it's not a reliable side signal —
    // half always is.
    var ab = (await db.from('at_bats').select('batter_id,result,half').eq('game_id',g.id)).data || [];
    var acesAbs = ab.filter(function(a){ return a.half===acesHalf && !BASERUNNER.test(a.result||''); });
    var oppAbs  = ab.filter(function(a){ return a.half!==acesHalf && !BASERUNNER.test(a.result||''); });

    // 3) pitches → current pitcher's count + last recorded velocity
    var pt = (await db.from('pitches').select('pitcher_id,velocity_mph,pitch_type,created_at').eq('game_id',g.id)).data || [];
    var oppPC=0, acesPC=0;
    pt.forEach(function(p){ if (p.pitcher_id==null) oppPC++; else if (p.pitcher_id===n.acesPitcherId) acesPC++; });
    // Most-recent pitch (that has a velo) thrown by whoever is currently on the mound
    var lastPitch = pt
      .filter(function(p){ return (isAcesBatting ? (p.pitcher_id==null) : (p.pitcher_id===n.acesPitcherId)) && p.velocity_mph!=null; })
      .sort(function(a,b){ return a.created_at<b.created_at?1:(a.created_at>b.created_at?-1:0); })[0] || null;

    // 4) radar → the gun's freshest reading beats the pitch row by several
    //    seconds (the row only gets its velo after the coach's tap + attach).
    //    One tiny query on a refresh we're already making. ?radar=off kills it.
    var radar = null;
    if (Q.get('radar') !== 'off') {
      try {
        var rrs = (await db.from('radar_readings').select('ts,peak_mph,exit_mph').order('ts',{ascending:false}).limit(2)).data || [];
        var rr = rrs[0];
        // a reading within 12s of the previous one is post-pitch noise (catcher's
        // throw back) - the gun can't tell direction, so cadence is the filter
        if (rr && rrs[1] && new Date(rr.ts).getTime() - new Date(rrs[1].ts).getTime() < 12000) rr = null;
        if (rr && Date.now() - new Date(rr.ts).getTime() < 45000) radar = rr;
      } catch(e) {}
    }

    render(g, n, isAcesBatting, acesAbs, oppAbs, oppPC, acesPC, lastPitch, radar);
    showBug();
    // half change → sponsors, then due up (oppName is render-scoped, so derive it here)
    spOnState(g, n, isAcesBatting, acesAbs, oppAbs, (g.opponents && g.opponents.name) || 'Opponent');
  }catch(e){ /* keep last frame on a hiccup */ }
  finally{ busy = false; }
}

// The pitcher is chosen from the whole roster and is often NOT in the batting
// order, so searching the order alone left this blank and the bug fell back to
// "Aces pitcher". Prefer the name lineup.html now stores, then the order, then
// the roster (fetched once, lazily).
// id -> { name, num, photo }. Also the source of the Due Up headshots, so it's
// loaded up front (one small query) and the images are warmed before any break.
var ROSTER = null;
async function loadRoster(){
  if (ROSTER) return;
  try{
    var r = await db.from('players').select('id,first_name,last_name,jersey_num,photo_url');
    ROSTER = {};
    (r.data||[]).forEach(function(p){
      ROSTER[p.id] = { name: p.first_name+' '+p.last_name, num: p.jersey_num, photo: p.photo_url || '' };
      if (p.photo_url){ var im = new Image(); im.src = p.photo_url; }   // warm the cache
    });
  }catch(e){ ROSTER = {}; }
}
function acesPitcherName(n){
  if (n.acesPitcherName) return n.acesPitcherName;
  var e = (n.lineup||[]).filter(function(x){return x.playerName;}).find(function(x){return x.playerId===n.acesPitcherId;});
  if (e) return e.playerName;
  if (ROSTER && n.acesPitcherId && ROSTER[n.acesPitcherId]) return ROSTER[n.acesPitcherId].name;
  if (n.acesPitcherId) loadRoster();   // fills in on the next poll
  return '';
}
function currentAcesBatter(n, acesAbs){
  // Mirror the scorer: the order is the NAMED slots only. lineup.html saves
  // nine slots whether filled or not, and walking the empty ones desynced this
  // from the scorer as soon as a lineup was short.
  var valid = (n.lineup || []).filter(function(x){return x.playerName;});
  if (!valid.length) return null;
  // The scorer's published pointer wins; the at-bat count is only a fallback
  // for games saved before pointers existed (count math breaks on resume/skip).
  if (n.curBatterIdx != null) return valid[n.curBatterIdx % valid.length];
  return valid[acesAbs.length % valid.length];
}
function batterTodayLine(batterId, acesAbs){
  var mine = acesAbs.filter(function(a){return a.batter_id===batterId;});
  var abCount = mine.filter(function(a){return !NOT_AB.test(a.result||'');}).length;
  var hits = mine.filter(function(a){return HIT.test(a.result||'');}).length;
  return abCount>0 ? (hits+'-'+abCount) : '';
}

function render(g, n, isAcesBatting, acesAbs, oppAbs, oppPC, acesPC, lastPitch, radar){
  // Live per-line toggles (set from overlay.html). Missing/true => shown.
  applyTiers(g.bug_show_pitching !== false, g.bug_show_atbat !== false);
  document.getElementById('scUs').textContent   = g.our_score||0;
  document.getElementById('scThem').textContent = g.opp_score||0;
  document.getElementById('innNum').textContent = g.inning||1;
  document.getElementById('innTri').textContent = (g.half === 'bottom') ? '▼' : '▲';  // literal half, not who bats

  var oppName = (g.opponents && g.opponents.name) || 'Opponent';
  document.getElementById('oppAbbr').textContent = teamAbbr(oppName);
  document.getElementById('oppLogo').textContent = teamInitials(oppName);

  setPips('b', g.balls||0, 'b', 3);
  setPips('s', g.strikes||0, 's', 2);
  setPips('o', g.outs||0, 'o', 2);
  document.getElementById('base1').className = 'base b1'+(g.base_1b?' on':'');
  document.getElementById('base2').className = 'base b2'+(g.base_2b?' on':'');
  document.getElementById('base3').className = 'base b3'+(g.base_3b?' on':'');
  document.getElementById('rowAces').className = 'trow aces'+(isAcesBatting?' bat':'');
  document.getElementById('rowOpp').className  = 'trow opp'+(isAcesBatting?'':' bat');

  // Pitching: whoever is NOT batting is on the mound
  var pitName = isAcesBatting ? (n.oppPitcher || 'Opp. pitcher') : (acesPitcherName(n) || 'Aces pitcher');
  document.getElementById('pitName').textContent = pitName;
  var pcEl = document.getElementById('pitPC');
  pcEl.textContent = isAcesBatting ? oppPC : acesPC;
  // Arm-care tint, our pitcher only (we don't track the opponent's kids)
  pcEl.className = isAcesBatting ? '' : armTierClass(acesPC);
  // Velo: a fresh gun reading newer than the last velo'd pitch row wins (it
  // lands ~1s after the mitt pop); otherwise the pitch row as always. A batted
  // ball's exit velo rides along for ~12s after contact.
  document.getElementById('pitVelo').textContent = veloLine(lastPitch, radar, Date.now());

  // At bat: the batting team's current hitter
  var batName = '', batLine = '';
  if (isAcesBatting){
    var b = currentAcesBatter(n, acesAbs);
    if (b){ batName = lastName(b.playerName) + (b.jerseyNum ? ' #'+b.jerseyNum : ''); batLine = batterTodayLine(b.playerId, acesAbs); }
    else { batName = 'Aces batter'; }
  } else {
    var ol = n.oppLineup || [];
    var ob = ol.length ? ol[oppAbs.length % ol.length] : null;
    batName = ob ? (ob.name + (ob.position?' · '+ob.position:'')) : (teamAbbr((g.opponents&&g.opponents.name)||'')+' batter');
  }
  document.getElementById('batName').textContent = batName;
  document.getElementById('batLine').textContent = batLine;
}

function setPips(prefix, n, cls, max){
  for (var k=0;k<max;k++){ document.getElementById(prefix+k).className = 'pip'+(k<n?' '+cls:''); }
}
function showBug(){ document.getElementById('bugwrap').classList.add('show'); document.getElementById('standby').classList.remove('show'); }
function hideBug(){
  document.getElementById('bugwrap').classList.remove('show');
  // a floated plate lives on <body>, outside the wrap — hide it now rather
  // than letting it linger until spinDock's next rotation notices
  document.getElementById('spDock').classList.remove('show');
}

// ── SPONSORS ────────────────────────────────────────────────────────────────
// Two placements, both automatic:
//   · dock  — a plate beside the scorebug, rotating throughout play
//   · break — a larger card on each half-inning change
// The half flip is the thing a hardware switcher can't know: the scorebug
// already receives inning/half every poll, so breaks fire on real game state
// instead of a timer or an operator remembering.
// Switches: ?sponsors=off (all)  ?sponsordock=off  ?sponsorbreak=off
//           ?sponsorsecs=N (dock rotation, default 40)
// A URL switch is a HARD override (set once in the YoloBox, always wins).
// Anything not pinned by URL follows app_settings, so controls.html can flip
// it mid-game from a phone.
var urlDockOff  = Q.get('sponsors')==='off' || Q.get('sponsordock')==='off';
var urlBreakOff = Q.get('sponsors')==='off' || Q.get('sponsorbreak')==='off';
var urlSecs     = Q.get('sponsorsecs') ? Math.max(8, parseInt(Q.get('sponsorsecs'),10)||40) : null;
var urlBasesOff = Q.get('bases')==='off';
var urlPos      = Q.get('pos') ? (Q.get('pos')||'').toLowerCase() : null;
var urlDueOff   = Q.get('dueup')==='off';
var urlDueSecs  = Q.get('dueupsecs') ? Math.max(3, parseInt(Q.get('dueupsecs'),10)||9) : null;
var SP = {
  list: [], i: 0, loadedAt: 0,
  dockOn:  !urlDockOff,
  breakOn: !urlBreakOff,
  dueOn:   !urlDueOff,
  everySec: urlSecs || 40,
  dueSec:  urlDueSecs || 9,
  lastHalfKey: null, breakTimer: null, breakBusy: false
};

// ── Live settings (controls.html) ───────────────────────────────────────────
var CFG = null, _cfgAt = 0;
async function loadCfg(){
  if (Date.now() - _cfgAt < 4000) return;          // the poll runs every 2.5s
  _cfgAt = Date.now();
  try{
    var r = await db.from('app_settings').select('*').eq('id',1).single();
    if (r.error || !r.data) return;
    CFG = r.data;
    applyCfg();
  }catch(e){}
}
function applyCfg(){
  if (!CFG) return;
  if (!urlDockOff)  SP.dockOn  = CFG.sponsor_dock !== false;
  if (!urlBreakOff) SP.breakOn = CFG.sponsor_break !== false;
  if (!urlDueOff)   SP.dueOn   = CFG.break_dueup !== false;
  if (!urlDueSecs && CFG.dueup_secs) SP.dueSec = Math.max(3, CFG.dueup_secs);
  if (!urlSecs && CFG.sponsor_secs && CFG.sponsor_secs !== SP.everySec){
    SP.everySec = Math.max(8, CFG.sponsor_secs);
    if (_dockTimer){ clearInterval(_dockTimer); _dockTimer = setInterval(spinDock, SP.everySec*1000); }
  }
  if (!SP.dockOn) document.getElementById('spDock').classList.remove('show');
  if (!urlBasesOff){
    var bs = document.querySelector('.bases');
    if (bs) bs.style.display = (CFG.bug_show_bases === false) ? 'none' : '';
  }
  if (!urlPos && CFG.bug_pos){
    var want = ['bl','br','tl','tr'].indexOf(CFG.bug_pos) >= 0 ? CFG.bug_pos : 'bl';
    var wrap = document.getElementById('bugwrap');
    if (wrap.className.indexOf('pos-'+want) < 0){
      var shown = wrap.classList.contains('show');
      wrap.className = 'bug-wrap pos-' + want + (shown ? ' show' : '');
    }
  }
  // size + sponsor placement: URL wins per field, settings fill the rest
  if (!urlScale) applyBugScale(CFG.bug_scale || 1);
  applySponsorPlace(urlSpPos || CFG.sponsor_pos || 'dock',
                    urlSpScale || CFG.sponsor_scale || 1);
}
function spUrl(path){
  return ACES_CONFIG.supabaseUrl + '/storage/v1/object/public/sponsors/' + path;
}
async function loadSponsors(){
  // refresh hourly so a sponsor added mid-season appears without a restart
  if (SP.list.length && Date.now() - SP.loadedAt < 3600000) return;
  try{
    var r = await db.from('sponsors').select('name,image_path,sort_order')
      .eq('active', true).order('sort_order').order('name');
    if (r.error || !r.data) return;
    SP.list = r.data; SP.loadedAt = Date.now();
    // warm the cache so the first fade doesn't show an empty plate
    SP.list.forEach(function(s){ var im = new Image(); im.src = spUrl(s.image_path); });
  }catch(e){}
}
function spNext(){
  if (!SP.list.length) return null;
  var s = SP.list[SP.i % SP.list.length];
  SP.i++;
  return s;
}
// Dock rotation runs on its own clock, independent of the 2.5s poll.
function spinDock(){
  if (!SP.dockOn) return;
  var dock = document.getElementById('spDock'), img = document.getElementById('spDockImg');
  if (!SP.list.length || !document.getElementById('bugwrap').classList.contains('show')){
    dock.classList.remove('show'); return;
  }
  var s = spNext(); if (!s) return;
  img.classList.remove('in');                       // fade out
  setTimeout(function(){
    img.onload = function(){ img.classList.add('in'); };
    img.src = spUrl(s.image_path); img.alt = s.name;
    dock.classList.add('show');
    if (img.complete) img.classList.add('in');      // cached: onload may not fire
  }, 500);
}
// Break card: 3 sponsors, ~5s each, then out. Skipped if one is already
// running (a fast half change shouldn't stack cards on top of each other).
// ── Between-innings break ───────────────────────────────────────────────────
// Sponsors first, then DUE UP — so the break ends by handing the viewer back
// into the game knowing who is coming to the plate. Either half can be turned
// off independently and the other still plays.
function dueRowsHtml(list){
  return list.map(function(b, i){
    // photo when we have one; otherwise the jersey number in the same circle,
    // and onerror falls back too so a dead URL never leaves a broken image
    var num  = (b.num!=null && b.num!=='') ? esc(b.num) : '';
    var name = esc(b.name || '').trim();
    var face = b.photo
      ? '<img class="due-pic" src="'+esc(b.photo)+'" alt="" '
        + 'onerror="this.outerHTML=\'<span class=&quot;due-ph&quot;>'+num+'</span>\'"/>'
      : '<span class="due-ph">'+num+'</span>';
    // Opponent orders are often just a jersey number. Rather than an empty
    // name beside a duplicated "#2", promote the number into the name slot.
    var numCol  = name && num ? '<span class="due-num">#'+num+'</span>' : '';
    var nameTxt = name || (num ? '#'+num : 'Batter');
    return '<div class="due-row">'
      + '<span class="due-ord">'+(i+1)+'</span>'
      + face
      + numCol
      + '<span class="due-name">'+nameTxt+'</span>'
      + (b.pos ? '<span class="due-pos">'+esc(b.pos)+'</span>' : '')
      + '</div>';
  }).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// Who leads off the half that just started. Counts are as of the end of the
// previous half, which is exactly the right basis for "next up".
function computeDueUp(n, isAcesBatting, acesAbs, oppAbs, oppName){
  if (isAcesBatting){
    var valid = (n.lineup||[]).filter(function(x){return x.playerName;});
    if (!valid.length) return null;
    var start = (n.curBatterIdx != null) ? (n.curBatterIdx % valid.length)
                                         : (acesAbs.length % valid.length);
    return { team: 'Delmarva Aces', list: [0,1,2].slice(0, Math.min(3, valid.length)).map(function(k){
      var b = valid[(start+k) % valid.length];
      // the lineup carries no photo, so pair it up from the roster
      var r = (ROSTER && b.playerId) ? ROSTER[b.playerId] : null;
      return { num: b.jerseyNum, name: b.playerName, pos: b.position, photo: r ? r.photo : '' };
    })};
  }
  var opp = (n.oppLineup||[]).filter(function(x){return x.name;});
  if (!opp.length) return null;              // no opponent order entered — skip
  var s2 = (n.curOppBatterIdx != null) ? (n.curOppBatterIdx % opp.length)
                                       : (oppAbs.length % opp.length);
  return { team: oppName || 'Opponent', list: [0,1,2].slice(0, Math.min(3, opp.length)).map(function(k){
    var b = opp[(s2+k) % opp.length];
    var m = String(b.name).match(/^#?(\d+)\s*(.*)$/);   // "12 Smith" / "#12" / "Smith"
    return m && m[2] ? { num: m[1], name: m[2], pos: b.position }
                     : { num: (m ? m[1] : ''), name: (m && !m[2] ? '' : b.name), pos: b.position };
  })};
}

function playBreak(dueUp){
  if (SP.breakBusy) return;
  var wantSponsors = SP.breakOn && SP.list.length > 0;
  var wantDue      = SP.dueOn && dueUp && dueUp.list.length > 0;
  if (!wantSponsors && !wantDue) return;

  var el   = document.getElementById('spBreak');
  var img  = document.getElementById('spBreakImg');
  var plate= document.getElementById('spPlate');
  var cap  = document.getElementById('spBreakCap');
  var due  = document.getElementById('dueCard');

  SP.breakBusy = true;
  el.classList.add('show');
  var shown = 0, count = wantSponsors ? Math.min(3, SP.list.length) : 0;

  var finish = function(){
    el.classList.remove('in');
    setTimeout(function(){
      el.classList.remove('show');
      plate.classList.remove('hide'); cap.classList.remove('hide'); due.classList.add('hide');
      SP.breakBusy = false;
    }, 650);
  };
  var showDue = function(){
    if (!wantDue) return finish();
    el.classList.remove('in');
    setTimeout(function(){
      plate.classList.add('hide'); cap.classList.add('hide');
      document.getElementById('dueTeam').textContent = dueUp.team;
      document.getElementById('dueRows').innerHTML = dueRowsHtml(dueUp.list);
      due.classList.remove('hide');
      el.classList.add('in');
      SP.breakTimer = setTimeout(finish, SP.dueSec * 1000);
    }, shown ? 600 : 0);
  };
  var step = function(){
    if (shown >= count) return showDue();
    var s = spNext(); shown++;
    el.classList.remove('in');
    setTimeout(function(){
      img.onload = function(){ el.classList.add('in'); };
      img.src = spUrl(s.image_path); img.alt = s.name;
      if (img.complete) el.classList.add('in');
      SP.breakTimer = setTimeout(step, 5000);
    }, shown === 1 ? 0 : 600);
  };
  step();
}
// Called from poll() with the live row: fire on a real half-inning change.
function spOnState(g, n, isAcesBatting, acesAbs, oppAbs, oppName){
  var key = (g.inning||1) + ':' + (g.half||'top');
  if (SP.lastHalfKey === null){ SP.lastHalfKey = key; return; }  // first sight isn't a change
  if (key !== SP.lastHalfKey){
    SP.lastHalfKey = key;
    playBreak(computeDueUp(n, isAcesBatting, acesAbs, oppAbs, oppName));
  }
}

var _dockTimer = null;
loadRoster();      // up front: Due Up headshots must be warm before the first break
loadSponsors();
setInterval(loadSponsors, 600000);
setTimeout(function(){ spinDock(); _dockTimer = setInterval(spinDock, SP.everySec*1000); }, 1500);

loadCfg();
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
